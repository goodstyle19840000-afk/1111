<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>時間力測定（スケジューリング） - DEEP SPACE WARP</title>
    <style>
        /* =========================================
           1. 基本設定＆カラーパレット
           ========================================= */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #0f172a);
            --accent-color: #0ea5e9; 
            --accent-glow: rgba(14, 165, 233, 0.6);
            --danger-color: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.6);
            --success-color: #10b981;
            --success-glow: rgba(16, 185, 129, 0.6);
            --warning-color: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; user-select: none; }
        
        /* 👑 iPhone Safari対策: 100dvh */
        body { 
            background-color: #000; color: #f8fafc; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100dvh; height: 100dvh; 
            padding: 0; overflow: hidden; -webkit-text-size-adjust: 100%; touch-action: manipulation; 
        }

        /* =========================================
           2. フェードアウト用クラス
           ========================================= */
        .fade-target {
            transition: opacity 2.5s ease-in; 
        }
        body.is-blackout .fade-target {
            opacity: 0 !important;
            pointer-events: none;
        }
        body.is-ended .fade-target {
            transition: none !important;
            opacity: 1 !important;
        }

        /* 背景 */
        .app-base-bg { position: fixed; inset: 0; height: 100dvh; background: var(--bg-gradient); z-index: -3; }

        /* 👑 修正: 画像が絶対に途切れない設定 (object-fit: contain) */
        .bg-img { 
            position: fixed !important; 
            top: 0 !important; left: 0 !important; 
            width: 100% !important; 
            height: 100dvh !important; 
            object-fit: contain !important; /* 左右をカットせず全表示 */
            z-index: -2; opacity: 0.4; 
        }

        .back-btn {
            position: absolute; top: 15px; left: 15px; z-index: 10005;
            display: inline-flex; align-items: center; gap: 5px; color: #fff; text-decoration: none; font-size: 0.9rem; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: all 0.2s;
        }
        .back-btn:hover { background: rgba(0,0,0,0.7); transform: translateY(-2px); border-color: rgba(255,255,255,0.4); }

        /* =========================================
           3. ゲームパネル & UI
           ========================================= */
        .game-panel {
            width: 100vw; height: 100dvh; 
            background: transparent; 
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }

        .top-controls { padding: 65px 15px 15px 15px; z-index: 10; flex-shrink: 0; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; font-size: 1.3rem; font-weight: bold; background: rgba(0, 0, 0, 0.6); border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); color: #fff; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: 600px; margin: 0 auto; }
        .title-left { text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .status-msg { font-size: 1rem; color: var(--warning-color); text-shadow: 0 0 10px rgba(245, 158, 11, 0.6); animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

        .play-area { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; padding: 10px; width: 100%; height: 100%; z-index: 5; }
        
        .warp-scene { position: absolute; inset: 0; perspective: 300px; z-index: 1; opacity: 0; transition: opacity 0.5s; }
        .warp-scene.show { opacity: 1; }
        .warp-particle {
            position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px var(--accent-color); opacity: 0; animation: warpParticle 3s linear infinite;
        }
        @keyframes warpParticle {
            0% { transform: translateZ(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateZ(300px) scale(0); opacity: 0; }
        }

        .timer-display { font-size: 6rem; font-weight: bold; color: var(--accent-color); text-shadow: 0 0 30px var(--accent-glow); font-variant-numeric: tabular-nums; z-index: 10; pointer-events: none; transition: opacity 0.5s; }
        .timer-display.hidden { opacity: 0; }

        .start-btn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); padding: 18px 50px; border: none; border-radius: 50px; font-size: 1.4rem; font-weight: bold; color: #fff; background: var(--accent-color); cursor: pointer; box-shadow: 0 4px 20px var(--accent-glow); letter-spacing: 2px; z-index: 60; white-space: nowrap; transition: transform 0.1s;}
        .start-btn:active { transform: translate(-50%, 2px); }

        .stop-flash { position: fixed; inset: 0; background: #fff; z-index: 99999; opacity: 0; pointer-events: none; transition: opacity 0.1s; }
        .stop-flash.show { opacity: 1; transition: none; }

        /* =========================================
           4. 計算エフェクトUI
           ========================================= */
        .calc-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; z-index: 10001; pointer-events: none;
            background: rgba(15, 23, 42, 0.85); padding: 30px 40px; border-radius: 20px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1); opacity: 0; 
        }
        .calc-stopped { font-size: 4rem; font-weight: bold; margin-bottom: 5px; opacity: 0; transform: translateY(20px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-variant-numeric: tabular-nums; text-shadow: 0 0 15px rgba(255,255,255,0.5);}
        .calc-target { font-size: 2.5rem; font-weight: bold; color: #cbd5e1; margin-bottom: 15px; opacity: 0; transform: translateY(20px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-variant-numeric: tabular-nums; }
        .calc-line { width: 100%; height: 3px; background: #fff; margin-bottom: 15px; opacity: 0; transform: scaleX(0); transition: all 0.4s ease; }
        .calc-error { font-size: 5rem; font-weight: bold; opacity: 0; transform: scale(0.5); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-variant-numeric: tabular-nums; }
        
        .calc-ui.show-bg { opacity: 1; }
        .calc-ui.step1 .calc-stopped { opacity: 1; transform: translateY(0); }
        .calc-ui.step2 .calc-target { opacity: 1; transform: translateY(0); }
        .calc-ui.step2 .calc-line { opacity: 1; transform: scaleX(1); }
        .calc-ui.step3 .calc-error { opacity: 1; transform: scale(1); }

        /* =========================================
           5. リザルト画面
           ========================================= */
        .result-overlay { 
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); display: none; flex-direction: column; align-items: center; justify-content: flex-start; overflow-y: auto; -webkit-overflow-scrolling: touch;
            z-index: 10002; padding: 70px 15px 40px 15px; opacity: 0; transition: opacity 0.5s; 
        }
        .result-overlay.show { display: flex; opacity: 1; }
        .result-overlay::-webkit-scrollbar { width: 6px; }
        .result-overlay::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 3px; }

        .result-title { font-size: 1.2rem; color: #94a3b8; margin-bottom: 5px; flex-shrink: 0; text-align: center;}
        .result-score { font-size: 4.5rem; font-weight: bold; text-shadow: 0 0 20px var(--accent-glow); margin-bottom: 30px; line-height: 1; flex-shrink: 0; }
        .result-score span { font-size: 2rem; color: #94a3b8; }

        .rank-stamp {
            font-size: 3rem; font-weight: bold; color: var(--success-color); text-shadow: 0 0 25px rgba(16, 185, 129, 0.8); border: 4px solid var(--success-color); border-radius: 12px; padding: 10px 20px; margin-bottom: 40px; transform: scale(3); opacity: 0; flex-shrink: 0; text-align: center; max-width: 95%; word-wrap: break-word;
        }
        .rank-stamp.drop { animation: stampDrop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes stampDrop { 0% { transform: scale(3) rotate(-10deg); opacity: 0; } 100% { transform: scale(1) rotate(-5deg); opacity: 1; } }

        .btn-group { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 350px; flex-shrink: 0; margin-top: auto; margin-bottom: 10px; }
        .cta-btn { width: 100%; padding: 15px; background: var(--accent-color); color: #fff; border-radius: 50px; font-weight: bold; font-size: 1.05rem; text-align: center; text-decoration: none; border: none; cursor: pointer; box-shadow: 0 4px 15px var(--accent-glow); white-space: nowrap; transition: transform 0.1s; }
        .cta-btn:active { transform: translateY(2px); }
        .cta-btn-outline { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); box-shadow: none; }

        /* =========================================
           PC・スマホ最適化
           ========================================= */
        @media (min-width: 769px) {
            .top-controls { padding: 80px 40px 20px 40px; }
            .status-bar { font-size: 2rem; padding: 15px 30px; border-radius: 20px; }
            .timer-display { font-size: 12rem; }
            .start-btn { font-size: 2rem; padding: 25px 80px; bottom: 60px; }
            .calc-ui { padding: 40px 60px; }
            .calc-stopped { font-size: 6rem; }
            .calc-target { font-size: 4rem; }
            .calc-error { font-size: 8rem; }
            .result-overlay { padding-top: 100px; }
            .result-title { font-size: 1.5rem; }
            .result-score { font-size: 8rem; margin-bottom: 50px; }
            .result-score span { font-size: 3rem; }
            .rank-stamp { font-size: 5rem; padding: 15px 40px; margin-bottom: 60px; border-width: 6px; }
            .btn-group { max-width: 450px; gap: 20px; margin-bottom: 50px;}
            .cta-btn { font-size: 1.3rem; padding: 20px; }
        }

        @media (max-width: 380px) {
            .status-bar { font-size: 1.1rem; padding: 10px 15px; }
            .timer-display { font-size: 5rem; }
            .calc-stopped { font-size: 3rem; }
            .calc-target { font-size: 2rem; }
            .calc-error { font-size: 3.5rem; }
            .rank-stamp { font-size: 2.2rem; border-width: 3px; padding: 8px 15px; margin-bottom: 30px;}
            .result-score { font-size: 3.8rem; }
            .cta-btn { padding: 14px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div class="app-base-bg fade-target"></div>
    <img src="" id="bgImage" class="bg-img fade-target" alt="Background">

    <a href="index.html" class="back-btn">⬅ ポータルへ戻る</a>

    <div class="game-panel">
        <div class="top-controls">
            <div class="status-bar">
                <div class="title-left">⏱️ 時間力測定</div>
                <div id="r_msg" class="status-msg">測定開始を押してください</div>
            </div>
        </div>

        <div class="play-area" id="touchArea">
            <div id="warpScene" class="warp-scene"></div>
            <div id="c_time" class="timer-display">0.000</div>
            
            <div id="calcUI" class="calc-ui">
                <div id="calcStopped" class="calc-stopped">10.000s</div>
                <div id="calcTarget" class="calc-target">- 10.000s</div>
                <div class="calc-line"></div>
                <div id="calcError" class="calc-error">+0.000s</div>
            </div>
            <div id="stopFlash" class="stop-flash"></div>
        </div>

        <button class="start-btn fade-target" id="c_start">測定開始</button>

        <div class="result-overlay" id="c_result">
            <div class="result-title">測定完了（誤差 ±sec）</div>
            <div class="result-score" id="c_rscore">±0.000 <span>sec</span></div>
            <div class="rank-stamp" id="r_rank_stamp">RANK A</div>
            <div class="btn-group">
                <button class="cta-btn cta-btn-outline" id="c_retry">もう一度プレイ</button>
                <a href="index.html" class="cta-btn">📊 レーダーチャートを確認</a>
            </div>
        </div>
    </div>

    <script>
        // Audio Engine
        const Engine = {
            ctx: null,
            initAudio() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            playStart() { 
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(200, this.ctx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 1.0);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 1.0);
                osc.start(); osc.stop(this.ctx.currentTime + 1.0);
            },
            playHide() { 
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(600, this.ctx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.start(); osc.stop(this.ctx.currentTime + 0.3);
            },
            playStop() { 
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(800, this.ctx.currentTime); 
                osc.frequency.setValueAtTime(300, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.6, this.ctx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.start(); osc.stop(this.ctx.currentTime + 0.1);
            },
            playCalc(type) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'triangle';
                if(type === 'step1') osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                if(type === 'step2') osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                if(type === 'step3') { osc.type='square'; osc.frequency.setValueAtTime(1200, this.ctx.currentTime); }
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.start(); osc.stop(this.ctx.currentTime + 0.2);
            }
        };

        // 時間力ゲームロジック
        const TimeGame = {
            target: 10.000,
            hideAt: 3.000,
            state: 'idle',
            startTime: 0, 
            hideTimeout: null,
            gameInterval: null,
            ranks: [
                {req: 0.030, n: "S級 神", c: "#10b981"}, 
                {req: 0.070, n: "A級 達人", c: "#0ea5e9"}, 
                {req: 0.150, n: "B級 プロ", c: "#8b5cf6"},
                {req: 0.300, n: "C級 一般", c: "#f59e0b"}, 
                {req: 0.500, n: "D級 素人", c: "#ef4444"},
                {req: 9.999,  n: "F級 不足", c: "#94a3b8"}
            ],
            els: { 
                area: document.getElementById('touchArea'), msg: document.getElementById('r_msg'), 
                timeDisplay: document.getElementById('c_time'), warpScene: document.getElementById('warpScene'),
                stopFlash: document.getElementById('stopFlash'), bgImage: document.getElementById('bgImage'),
                btn: document.getElementById('c_start'), over: document.getElementById('c_result'), 
                fs: document.getElementById('c_rscore'), stamp: document.getElementById('r_rank_stamp'),
                calcUI: document.getElementById('calcUI'), calcStopped: document.getElementById('calcStopped'),
                calcTarget: document.getElementById('calcTarget'), calcError: document.getElementById('calcError')
            },
            
            init() {
                this.state = 'idle'; clearTimeout(this.hideTimeout); clearInterval(this.gameInterval);
                document.body.classList.remove('is-blackout');
                document.body.classList.remove('is-ended');
                this.els.timeDisplay.textContent = "0.000";
                this.els.timeDisplay.classList.remove('hidden'); 
                this.els.msg.textContent = "測定開始を押してください";
                this.els.msg.style.color = "var(--warning-color)";
                this.els.msg.style.animation = "pulse 1s infinite alternate";
                
                const randomImgNum = Math.floor(Math.random() * 195) + 1;
                this.els.bgImage.src = `bg/bg (${randomImgNum}).webp`;
                this.els.warpScene.classList.remove('show');
                this.els.calcUI.className = 'calc-ui';

                const particles = this.els.warpScene.querySelectorAll('.warp-particle');
                particles.forEach(p => { p.style.animationPlayState = 'paused'; });

                this.els.over.classList.remove('show'); 
                this.els.over.scrollTop = 0; 
                this.els.stamp.classList.remove('drop');
                this.els.btn.style.display = 'block';
            },

            createParticles() {
                if (this.els.warpScene.children.length > 0) return; 
                const numParticles = 80;
                for (let i = 0; i < numParticles; i++) {
                    const d = document.createElement('div');
                    d.className = 'warp-particle';
                    d.style.left = `${Math.random() * 100}%`;
                    d.style.top = `${Math.random() * 100}%`;
                    d.style.animationDelay = `${Math.random() * 3}s`;
                    d.style.animationPlayState = 'paused'; 
                    this.els.warpScene.appendChild(d);
                }
            },

            start() {
                Engine.initAudio();
                this.state = 'playing';
                this.els.btn.style.display = 'none';
                this.els.msg.textContent = "10.000sで止めろ！";
                this.els.msg.style.color = "var(--accent-color)";
                this.els.msg.style.animation = "none";
                this.els.warpScene.classList.add('show');
                const particles = this.els.warpScene.querySelectorAll('.warp-particle');
                particles.forEach(p => { p.style.animationPlayState = 'running'; });
                this.startTime = performance.now();
                
                this.gameInterval = setInterval(() => {
                    const elapsed = (performance.now() - this.startTime) / 1000;
                    this.els.timeDisplay.textContent = elapsed.toFixed(3);
                }, 10);

                this.hideTimeout = setTimeout(() => {
                    if (this.state === 'playing') {
                        this.els.timeDisplay.classList.add('hidden');
                        Engine.playHide();
                        document.body.classList.add('is-blackout');
                    }
                }, 3000);
                Engine.playStart();
            },

            stop(e) {
                if (this.state !== 'playing') return;
                this.state = 'ended';
                const finalTime = (performance.now() - this.startTime) / 1000;
                clearInterval(this.gameInterval);
                clearTimeout(this.hideTimeout);
                Engine.playStop();
                this.els.stopFlash.classList.add('show');
                document.body.classList.remove('is-blackout');
                document.body.classList.add('is-ended');
                const particles = this.els.warpScene.querySelectorAll('.warp-particle');
                particles.forEach(p => { p.style.animationPlayState = 'paused'; });
                setTimeout(() => this.els.stopFlash.classList.remove('show'), 100);

                const error = finalTime - this.target;
                const errorAbs = Math.abs(error);
                const sign = error > 0 ? "+" : (error < 0 ? "-" : "±");

                this.els.calcStopped.textContent = finalTime.toFixed(3) + "s";
                this.els.calcError.textContent = `${sign}${errorAbs.toFixed(3)}s`;

                if (errorAbs <= 0.07) {
                    this.els.calcError.style.color = "var(--success-color)";
                    this.els.calcError.style.textShadow = "0 0 20px var(--success-glow)";
                } else if (errorAbs <= 0.3) {
                    this.els.calcError.style.color = "var(--accent-color)";
                    this.els.calcError.style.textShadow = "0 0 20px var(--accent-glow)";
                } else {
                    this.els.calcError.style.color = "var(--danger-color)";
                    this.els.calcError.style.textShadow = "0 0 20px var(--danger-glow)";
                }

                this.els.calcUI.classList.add('show-bg');
                setTimeout(() => { this.els.calcUI.classList.add('step1'); Engine.playCalc('step1'); }, 400); 
                setTimeout(() => { this.els.calcUI.classList.add('step2'); Engine.playCalc('step2'); }, 1200); 
                setTimeout(() => { this.els.calcUI.classList.add('step3'); Engine.playCalc('step3'); }, 2000); 

                let currentBest = localStorage.getItem('b_tim');
                if (!currentBest || currentBest === "---" || errorAbs < parseFloat(currentBest)) {
                    localStorage.setItem('b_tim', errorAbs.toFixed(3));
                }

                let rank = this.ranks[this.ranks.length-1];
                for(let r of this.ranks) { if(errorAbs <= r.req) { rank = r; break; } }
                this.els.fs.innerHTML = `±${errorAbs.toFixed(3)} <span>sec</span>`;
                this.els.stamp.textContent = `RANK: ${rank.n}`;
                this.els.stamp.style.color = rank.c;
                this.els.stamp.style.borderColor = rank.c;
                this.els.stamp.style.textShadow = `0 0 30px ${rank.c}`;

                setTimeout(() => {
                    this.els.calcUI.className = 'calc-ui'; 
                    this.els.over.classList.add('show');
                    setTimeout(() => {
                        this.els.over.scrollTo({ top: this.els.over.scrollHeight / 2, behavior: 'smooth' });
                    }, 200);
                    setTimeout(() => {
                        this.els.stamp.classList.add('drop');
                    }, 300);
                }, 3800);
            }
        };

        let isTouching = false;
        document.body.addEventListener('touchstart', e => { 
            if(e.target.closest('.back-btn') || e.target.closest('.start-btn') || e.target.closest('.cta-btn')) return;
            e.preventDefault(); isTouching = true; 
            if(TimeGame.state === 'playing') TimeGame.stop(e); 
        }, {passive: false});
        
        document.body.addEventListener('mousedown', e => { 
            if(e.target.closest('.back-btn') || e.target.closest('.start-btn') || e.target.closest('.cta-btn')) return;
            if(!isTouching && TimeGame.state === 'playing') TimeGame.stop(e); 
        });
        
        TimeGame.els.btn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            TimeGame.createParticles(); 
            TimeGame.start();
        });

        document.getElementById('c_retry').addEventListener('click', () => {
            TimeGame.init();
        });

        TimeGame.init();
    </script>
