<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>時間管理能力テスト - 10sec Challenge</title>
    
    <style>
        :root {
            --accent-blue: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.6);
            --bg-dark: #020617;
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Helvetica Neue', Arial, sans-serif;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* 👑 iPhone Safari対策: 100dvh */
        body { 
            background: var(--bg-dark); color: var(--text-main); 
            min-height: 100dvh; overflow: hidden; 
            display: flex; flex-direction: column; align-items: center;
        }

        /* =========================================
           👑 背景不動レイヤー・クロスフェード設定
           ========================================= */
        #bgContainer {
            position: fixed !important; inset: 0 !important;
            width: 100% !important; height: 100dvh !important;
            z-index: -2;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-layer {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            background-size: cover; background-position: center center; background-repeat: no-repeat;
            filter: blur(25px) brightness(0.35); 
            transform: scale(1.15);
            transition: opacity 2s ease-in-out, filter 0.6s, transform 0.6s, background-size 0.6s;
            will-change: transform, opacity;
            opacity: 0;
        }

        /* 👑 のぞき見（隠しコマンド）発動時 */
        body.view-bg #bgContainer { z-index: 1000 !important; }
        body.view-bg .bg-layer { 
            background-size: contain !important; /* 左右を途切れさせない */
            filter: blur(0) brightness(0.9) !important; 
            transform: scale(1.0) !important; 
            background-color: #000;
        }
        /* のぞき見中はUIを消す */
        body.view-bg .app-container, body.view-bg .back-btn, body.view-bg .scanlines {
            opacity: 0 !important; pointer-events: none;
        }

        .scanlines {
            position: fixed; inset: 0; z-index: -1;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px; pointer-events: none; transition: opacity 0.5s;
        }

        .back-btn {
            position: absolute; top: 10px; left: 10px; z-index: 3000;
            display: inline-flex; align-items: center; gap: 5px; color: #fff; text-decoration: none; font-size: 0.85rem; font-weight: bold; background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 20px; border: 1px solid var(--glass-border); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: all 0.2s;
        }
        .back-btn:hover { background: rgba(0,0,0,0.7); transform: translateY(-2px); }

        /* =========================================
           ⚙️ ゲームレイアウト
           ========================================= */
        .app-container { 
            width: 100%; max-width: 480px; height: 100dvh;
            display: flex; flex-direction: column; 
            padding: 55px 20px 20px 20px;
            position: relative; z-index: 10; transition: opacity 0.5s;
        }
        
        header { text-align: center; margin-bottom: 10px; }
        .game-title { font-size: 1.3rem; font-weight: bold; color: #fff; text-shadow: 0 0 15px var(--accent-glow); }
        .game-desc { font-size: 0.8rem; color: var(--text-dim); margin-top: 4px; }

        .game-panel {
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); flex: 1;
            display: flex; flex-direction: column; justify-content: space-around; align-items: center;
        }

        .target-time { font-size: 1rem; color: var(--accent-blue); letter-spacing: 2px; font-weight: bold; }
        
        /* タイマー表示エリア */
        .timer-display { position: relative; width: 220px; height: 220px; display: flex; justify-content: center; align-items: center; }
        .time-text { font-size: 4rem; font-weight: 900; color: #fff; text-shadow: 0 0 15px #fff; font-variant-numeric: tabular-nums; z-index: 10; }
        /* 隠れた状態のテキスト */
        .time-text.hidden { color: rgba(255,255,255,0.03); text-shadow: none; }

        /* 円形プログレスバー */
        .timer-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
        .timer-circle-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 10; }
        .timer-circle-bar { fill: none; stroke: var(--accent-blue); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 628; stroke-dashoffset: 628; transition: stroke-dashoffset 0.1s linear; filter: drop-shadow(0 0 10px var(--accent-blue)); }

        .advice-text { font-size: 0.85rem; color: var(--text-dim); text-align: center; line-height: 1.5; height: 3em; margin-bottom: 20px; }

        .game-btn {
            width: 100%; max-width: 280px; padding: 20px; 
            background: var(--accent-blue); color: #fff; border-radius: 50px; 
            font-weight: bold; font-size: 1.2rem; text-align: center; border: none; cursor: pointer; 
            box-shadow: 0 4px 20px var(--accent-glow); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .game-btn:active { transform: scale(0.96); box-shadow: 0 2px 10px var(--accent-glow); }
        .game-btn.stop { background: var(--danger); box-shadow: 0 4px 20px rgba(239, 68, 68, 0.5); }
        .game-btn.reset { background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: #fff; box-shadow: none; margin-top: 15px;}

        /* 結果表示オーバーレイ（全画面） */
        #resultOverlay {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            padding: 40px 20px; opacity: 0; pointer-events: none; transition: opacity 0.5s;
        }
        #resultOverlay.active { opacity: 1; pointer-events: auto; }

        .result-title { font-size: 1rem; color: var(--text-dim); margin-bottom: 5px; }
        .result-time-diff { font-size: 4rem; font-weight: bold; color: #fff; text-shadow: 0 0 20px var(--accent-glow); margin-bottom: 5px; }
        .actual-time { font-size: 1rem; color: var(--text-sub); margin-bottom: 25px; }
        
        /* ランクスタンプ */
        .rank-stamp {
            font-size: 2.5rem; font-weight: bold; border: 4px solid; border-radius: 12px;
            padding: 10px 20px; margin-bottom: 40px; transform: scale(3); opacity: 0; white-space: nowrap;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .rank-stamp.drop { animation: stampDrop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes stampDrop { 0% { transform: scale(3) rotate(-10deg); opacity: 0; } 100% { transform: scale(1) rotate(-5deg); opacity: 1; } }

        @media (min-width: 769px) {
            .app-container { max-width: 500px; padding-top: 70px; }
            .game-panel { padding: 40px; }
            .timer-display { width: 280px; height: 280px; }
            .time-text { font-size: 5rem; }
            .timer-circle-bar { stroke-dasharray: 817; stroke-dashoffset: 817; } /* 半径130用 */
            .result-time-diff { font-size: 6rem; }
            .rank-stamp { font-size: 4rem; border-width: 6px; }
        }
    </style>
</head>
<body>

    <div id="bgContainer">
        <div class="bg-layer" id="bg1"></div>
        <div class="bg-layer" id="bg2"></div>
    </div>
    <div class="scanlines"></div>

    <a href="index.html" class="back-btn">⬅ ポータルへ戻る</a>

    <div class="app-container">
        <header>
            <h1 class="game-title">時間管理能力テスト</h1>
            <p class="game-desc">ジャスト10秒で停止させろ</p>
        </header>

        <div class="game-panel">
            <div class="target-time">TARGET: 10.000s</div>
            
            <div class="timer-display">
                <div class="time-text" id="timeDisplay">0.00</div>
                <svg class="timer-svg" viewBox="0 0 300 300">
                    <circle class="timer-circle-bg" cx="150" cy="150" r="130"></circle>
                    <circle class="timer-circle-bar" id="progressBar" cx="150" cy="150" r="130"></circle>
                </svg>
            </div>

            <div class="advice-text" id="adviceText">「START」を押すと計測開始。5秒後、表示が隠れます。感覚だけを頼りに10秒を目指してください。</div>

            <button class="game-btn" id="actionBtn" onclick="handleAction()">START</button>
        </div>
    </div>

    <div id="resultOverlay">
        <div class="result-title">誤差（10.000sからのずれ）</div>
        <div class="result-time-diff" id="resultDiff">±0.000s</div>
        <div class="actual-time" id="actualTimeText">実測値: 10.000s</div>
        <div class="rank-stamp" id="q_rank_stamp">RANK: ---</div>
        
        <div class="btn-group">
            <button class="cta-btn reset" onclick="resetGame()">もう一度チャレンジ</button>
            <a href="index.html" class="cta-btn cta-btn-outline">📊 総合分析へ戻る</a>
        </div>
    </div>

    <script>
        // =========================================
        // 🖼️ 背景クロスフェード・システム（移植）
        // =========================================
        const bgs = [document.getElementById('bg1'), document.getElementById('bg2')];
        let currentBgIdx = 0;

        function initAppBg() {
            const randomNum = Math.floor(Math.random() * 200) + 1;
            bgs[0].style.backgroundImage = `url('bg/bg (${randomNum}).webp')`;
            bgs[0].style.opacity = 1; bgs[0].style.zIndex = 1;
            bgs[1].style.opacity = 0; bgs[1].style.zIndex = 0;
        }

        function updateBg() {
            const nextIdx = (currentBgIdx + 1) % 2;
            const randomNum = Math.floor(Math.random() * 200) + 1;
            const img = new Image();
            img.src = `bg/bg (${randomNum}).webp`;
            img.onload = () => {
                bgs[nextIdx].style.backgroundImage = `url('${img.src}')`;
                bgs[nextIdx].style.zIndex = 1; bgs[currentBgIdx].style.zIndex = 0;
                bgs[nextIdx].style.opacity = 1; bgs[currentBgIdx].style.opacity = 0;
                currentBgIdx = nextIdx;
            };
        }

        initAppBg();
        setInterval(updateBg, 4000);

        // =========================================
        // ⏱️ ゲームロジック
        // =========================================
        const timeDisplay = document.getElementById('timeDisplay');
        const progressBar = document.getElementById('progressBar');
        const actionBtn = document.getElementById('actionBtn');
        const adviceText = document.getElementById('adviceText');
        const resultOverlay = document.getElementById('resultOverlay');
        const rankStamp = document.getElementById('q_rank_stamp');

        let gameState = 'ready'; // ready, running
        let startTime, timerId;
        const TARGET_TIME = 10000; // ms
        
        // PC/MobileでSVGの円周を変える
        const isMobile = window.innerWidth <= 768;
        const radius = isMobile ? 130 : 130; // viewBoxを300固定にしたので、R130で統一
        const circumference = 2 * Math.PI * radius; // 628 or 817

        const ranks = [
            {err: 0.05, n: ""S級 神"", c: "#10b981"}, 
            {req: 8,  err: 0.15, n: "A級 達人", c: "#0ea5e9"}, 
            {req: 6,  err: 0.30, n: "B級 プロ", c: "#8b5cf6"},
            {req: 4,  err: 0.50, n: "C級 一般", c: "#f59e0b"}, 
            {req: 0,  err: Infinity, n: "D級 素人", c: "#ef4444"}
        ];

        function handleAction() {
            if (gameState === 'ready') {
                startTimer();
            } else if (gameState === 'running') {
                stopTimer();
            }
        }

        function startTimer() {
            gameState = 'running';
            actionBtn.innerText = 'STOP';
            actionBtn.classList.add('stop');
            adviceText.innerText = '集中してください。5秒後に表示が消えます。';
            
            startTime = Date.now();
            progressBar.style.strokeDasharray = circumference;
            
            timerId = setInterval(updateDisplay, 10); // 10msごとに更新
        }

        function updateDisplay() {
            const elapsed = Date.now() - startTime;
            const seconds = (elapsed / 1000).toFixed(2);
            timeDisplay.innerText = seconds;

            // プログレスバーの更新 (10秒で一周)
            const offset = circumference * (1 - Math.min(1, elapsed / TARGET_TIME));
            progressBar.style.strokeDashoffset = offset;

            // 👑 修正: 5秒後に表示を隠す、色を変える
            if (elapsed >= 5000 && !timeDisplay.classList.contains('hidden')) {
                timeDisplay.classList.add('hidden');
                adviceText.innerText = '視覚情報をシャットダウン。感覚のみで10秒を刻め。';
                progressBar.style.stroke = 'rgba(14, 165, 233, 0.2)'; // バーの色を薄く
            }
        }

        function stopTimer() {
            clearInterval(timerId);
            gameState = 'finished';
            const finishTime = Date.now() - startTime;
            
            actionBtn.style.display = 'none'; // ボタンを一時的に消す
            timeDisplay.classList.remove('hidden'); // 時間を表示
            progressBar.style.stroke = 'var(--accent-blue)'; // バーの色を戻す
            
            showResult(finishTime);
        }

        function showResult(finishTime) {
            const actualSeconds = finishTime / 1000;
            const error = Math.abs(10 - actualSeconds);
            const score = Math.max(0, 100 - (error * 50)); // スコア計算 (誤差0.1sごとに5pt減)
            
            // 👑 修正: ローカルストレージに「誤差」として保存（小さいほうが良い）
            const currentBestError = parseFloat(localStorage.getItem('b_tim') || 999.9);
            if (error < currentBestError) localStorage.setItem('b_tim', error);

            document.getElementById('actualTimeText').innerText = `実測値: ${actualSeconds.toFixed(3)}s`;
            const sign = (actualSeconds >= 10) ? '+' : '-';
            document.getElementById('resultDiff').innerText = `±${error.toFixed(3)}s`;

            // ランク判定
            let rank = ranks[ranks.length-1];
            for(let r of ranks) { if(error <= r.err) { rank = r; break; } }

            rankStamp.innerText = rank.n;
            rankStamp.style.color = rank.c;
            rankStamp.style.borderColor = rank.c;
            rankStamp.style.textShadow = `0 0 20px ${rank.c}`;
            
            resultOverlay.classList.add('active');
            
            setTimeout(() => {
                rankStamp.classList.add('drop');
            }, 300);
        }

        function resetGame() {
            resultOverlay.classList.remove('active');
            rankStamp.classList.remove('drop');
            actionBtn.style.display = 'block';
            actionBtn.innerText = 'START';
            actionBtn.classList.remove('stop');
            adviceText.innerText = '「START」を押すと計測開始。5秒後、表示が隠れます。感覚だけを頼りに10秒を目指してください。';
            timeDisplay.innerText = '0.00';
            progressBar.style.strokeDashoffset = circumference;
            progressBar.style.stroke = 'var(--accent-blue)';
            gameState = 'ready';
        }

        // =========================================
        // 👆 隠しコマンド：のぞき見機能 (移植)
        // =========================================
        const triggerPeek = (e) => {
            // パネルや戻るボタンの上では発動させない
            if (e.target.closest('.game-panel') || e.target.closest('.back-btn')) return;
            document.body.classList.add('view-bg');
        };
        const endPeek = () => document.body.classList.remove('view-bg');

        window.addEventListener('touchstart', triggerPeek, { passive: true });
        window.addEventListener('touchend', endPeek, { passive: true });
        window.addEventListener('mousedown', triggerPeek);
        window.addEventListener('mouseup', endPeek);
        window.oncontextmenu = (e) => { e.preventDefault(); e.stopPropagation(); return false; };

    </script>
</body>
</html>
