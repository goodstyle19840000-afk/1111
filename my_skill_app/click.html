<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>連打力（処理能力）測定 - ULTIMATE FULLSCREEN</title>
    <style>
        /* =========================================
           1. 基本設定＆カラーパレット
           ========================================= */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #0f172a);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --accent-color: #0ea5e9; 
            --accent-glow: rgba(14, 165, 233, 0.6);
            --danger-color: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.6);
            --success-color: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; user-select: none; }
        
        /* 👑 修正: スマホでもPCでも余白ゼロ！完全な全画面へ */
        body { background: var(--bg-gradient); color: var(--text-main); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding: 0; overflow: hidden; -webkit-text-size-adjust: 100%; touch-action: manipulation; }

        /* ポータルへ戻るボタン (全画面に対応した配置) */
        .back-btn {
            position: absolute; top: 15px; left: 15px; z-index: 100;
            display: inline-flex; align-items: center; gap: 5px; color: #fff; text-decoration: none; font-size: 0.9rem; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .back-btn:hover { background: rgba(0,0,0,0.7); transform: translateY(-2px); border-color: rgba(255,255,255,0.4); }

        /* =========================================
           2. ゲームパネル (👑 iPhoneでも全画面に設定)
           ========================================= */
        .game-panel {
            width: 100vw; height: 100vh; height: 100dvh; 
            max-width: none; max-height: none; 
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); 
            border: none; border-radius: 0; /* 角丸と枠線を削除し画面の端まで広げる */
            display: flex; flex-direction: column; position: relative; overflow: hidden; transition: all 0.3s ease;
        }

        /* 👑 修正: 戻るボタンと被らないように上部の余白(padding-top)を大きく取る */
        .top-controls { padding: 65px 15px 15px 15px; z-index: 10; flex-shrink: 0; position: relative; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; font-size: 1.3rem; font-weight: bold; background: rgba(0, 0, 0, 0.4); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); color: #fff; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); max-width: 600px; margin: 0 auto; }
        .time-left { color: var(--accent-color); text-shadow: 0 0 10px var(--accent-glow); font-variant-numeric: tabular-nums; }
        .score-display { color: #fff; }

        /* =========================================
           3. プレイエリアとアニメーション
           ========================================= */
        .play-area { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; min-height: 0; padding: 10px; }
        
        /* 👑 修正: iPhoneでも限界まで画像を巨大化 */
        .enemy-media {
            width: 100%; height: 100%; 
            max-width: none; max-height: none; 
            object-fit: contain; /* アスペクト比を保ちつつ最大化 */
            filter: drop-shadow(0 0 20px var(--accent-glow)); 
            transition: transform 0.05s ease-out, filter 0.1s;
            pointer-events: none; 
        }
        .play-area.hit .enemy-media { transform: scale(0.92); filter: drop-shadow(0 0 40px var(--danger-glow)) brightness(1.2); }

        .enemy-media.explode { animation: digitalExplosion 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
        @keyframes digitalExplosion {
            0% { transform: scale(1); filter: brightness(1) drop-shadow(0 0 20px var(--danger-glow)); opacity: 1; }
            20% { transform: scale(1.1) rotate(5deg); filter: brightness(2) invert(1) hue-rotate(90deg); opacity: 1; }
            40% { transform: scale(0.9) rotate(-5deg); filter: brightness(3) invert(0); opacity: 1; }
            100% { transform: scale(2.5); filter: brightness(10) blur(20px); opacity: 0; }
        }

        .floating-damage { position: absolute; color: #fff; font-weight: bold; font-size: 3rem; text-shadow: 0 0 10px var(--accent-color), 0 0 20px var(--accent-color); pointer-events: none; animation: floatUp 0.5s ease-out forwards; z-index: 50; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 20% { transform: translateY(-20px) scale(1.2); opacity: 1; } 100% { transform: translateY(-100px) scale(1.5); opacity: 0; } }

        .hp-bar-wrapper { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); width: 85%; max-width: 600px; z-index: 10; pointer-events: none; flex-shrink: 0;}
        .hp-bar-container { width: 100%; height: 14px; background: rgba(0,0,0,0.6); border-radius: 7px; overflow: hidden; border: 1px solid var(--glass-border); box-shadow: inset 0 0 5px rgba(0,0,0,0.8); }
        .hp-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #0ea5e9, #3b82f6); transition: width 0.1s ease-out; box-shadow: 0 0 10px var(--accent-glow); }

        .start-btn { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); padding: 18px 50px; border: none; border-radius: 50px; font-size: 1.4rem; font-weight: bold; color: #fff; background: var(--accent-color); cursor: pointer; box-shadow: 0 4px 20px var(--accent-glow); letter-spacing: 2px; z-index: 25; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;}
        .start-btn:active { transform: translate(-50%, 2px); box-shadow: 0 2px 10px var(--accent-glow); }

        /* 👑 修正: カウントダウンも全画面に */
        .countdown-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); border-radius: 0; z-index: 80; opacity: 0; }
        .countdown-overlay.show { display: flex; opacity: 1; }
        .countdown-text { font-size: 8rem; font-weight: bold; color: #fff; text-shadow: 0 0 30px var(--accent-glow); transition: font-size 0.3s;}
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 40% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

        /* =========================================
           4. リザルト画面
           ========================================= */
        .result-overlay { 
            position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); border-radius: 0; display: none; flex-direction: column; align-items: center; 
            justify-content: flex-start; overflow-y: auto; -webkit-overflow-scrolling: touch;
            z-index: 90; padding: 70px 15px 40px 15px; 
            color: #fff; opacity: 0; transition: opacity 0.5s; 
        }
        .result-overlay.show { display: flex; opacity: 1; }
        
        .result-overlay::-webkit-scrollbar { width: 6px; }
        .result-overlay::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
        .result-overlay::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 3px; box-shadow: 0 0 10px var(--accent-glow); }

        .result-title { font-size: 1.2rem; color: #94a3b8; margin-bottom: 5px; flex-shrink: 0; text-align: center;}
        .result-score { font-size: 4.5rem; font-weight: bold; color: #fff; text-shadow: 0 0 20px var(--accent-glow); margin-bottom: 5px; line-height: 1; flex-shrink: 0; }
        .result-cps { font-size: 1.1rem; color: var(--accent-color); margin-bottom: 30px; flex-shrink: 0; }

        .rank-stamp {
            font-size: 3rem; font-weight: bold; color: var(--success-color); text-shadow: 0 0 25px rgba(16, 185, 129, 0.8);
            border: 4px solid var(--success-color); border-radius: 12px; padding: 10px 20px; margin-bottom: 40px;
            transform: scale(3); opacity: 0; flex-shrink: 0;
            text-align: center; max-width: 95%; word-wrap: break-word;
        }
        .rank-stamp.drop { animation: stampDrop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes stampDrop { 0% { transform: scale(3) rotate(-10deg); opacity: 0; } 100% { transform: scale(1) rotate(-5deg); opacity: 1; } }

        .btn-group { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 350px; flex-shrink: 0; margin-top: auto; margin-bottom: 10px; }
        .cta-btn { width: 100%; padding: 15px; background: var(--accent-color); color: #fff; border-radius: 50px; font-weight: bold; font-size: 1.05rem; text-align: center; text-decoration: none; border: none; cursor: pointer; box-shadow: 0 4px 15px var(--accent-glow); transition: all 0.2s; white-space: nowrap; }
        .cta-btn:active { transform: translateY(2px); box-shadow: 0 2px 8px var(--accent-glow); }
        .cta-btn-outline { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.3); box-shadow: none; }
        .cta-btn-outline:active { background: rgba(255,255,255,0.2); }

        /* =========================================
           5. PC（大画面）向けのさらなる特大化
           ========================================= */
        @media (min-width: 769px) {
            .top-controls { padding: 80px 40px 20px 40px; }
            .status-bar { font-size: 2rem; padding: 15px 30px; border-radius: 20px; }
            
            .floating-damage { font-size: 5rem; }
            
            .hp-bar-wrapper { bottom: 130px; width: 60%; }
            .hp-bar-container { height: 18px; border-radius: 9px; }
            
            .start-btn { font-size: 2rem; padding: 25px 80px; bottom: 40px; }
            .countdown-text { font-size: 15rem; }
            
            .result-overlay { padding-top: 100px; }
            .result-title { font-size: 1.5rem; }
            .result-score { font-size: 8rem; }
            .result-cps { font-size: 1.5rem; margin-bottom: 50px; }
            .rank-stamp { font-size: 5rem; padding: 15px 40px; margin-bottom: 60px; border-width: 6px; }
            
            .btn-group { max-width: 450px; gap: 20px; margin-bottom: 50px;}
            .cta-btn { font-size: 1.3rem; padding: 20px; }
        }

        /* スマホ（極小画面）向け微調整 */
        @media (max-width: 380px) {
            .status-bar { font-size: 1.1rem; padding: 10px 15px; }
            .rank-stamp { font-size: 2.2rem; border-width: 3px; padding: 8px 15px; margin-bottom: 30px;}
            .result-score { font-size: 3.8rem; }
            .btn-group { gap: 10px; }
            .cta-btn { padding: 14px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">⬅ ポータルへ戻る</a>

    <div class="game-panel">
        <div class="top-controls">
            <div class="status-bar">
                <div class="time-left">⏱️ <span id="c_time">10.0</span> s</div>
                <div class="score-display">⚡ <span id="c_score">0</span> Hits</div>
            </div>
        </div>

        <div class="play-area" id="c_target">
            <img src="assets/enemy.webp" class="enemy-media" id="c_img" alt="TARGET" onerror="this.src='enemy.webp'">
        </div>

        <div class="hp-bar-wrapper">
            <div class="hp-bar-container"><div class="hp-bar-fill" id="c_hp"></div></div>
        </div>

        <button class="start-btn" id="c_start">システム起動</button>
        
        <div class="countdown-overlay" id="c_count_overlay"><div class="countdown-text" id="c_count_text">3</div></div>

        <div class="result-overlay" id="c_result">
            <div class="result-title">処理完了（TOTAL HITS）</div>
            <div class="result-score" id="c_rscore">0</div>
            <div class="result-cps" id="c_rcps">0.00 Hits/sec</div>
            
            <div class="rank-stamp" id="c_rank_stamp">RANK A</div>

            <div class="btn-group">
                <button class="cta-btn cta-btn-outline" id="c_retry">もう一度プレイ</button>
                <a href="index.html" class="cta-btn">📊 レーダーチャートを確認</a>
            </div>
        </div>
    </div>

    <script>
        // =========================================
        // 🔧 Audio Engine
        // =========================================
        const Engine = {
            ctx: null,
            initAudio() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            playHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'square'; 
                osc.frequency.setValueAtTime(300, this.ctx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.start(); osc.stop(this.ctx.currentTime + 0.1);
            }
        };

        // =========================================
        // 🎯 ゲームロジック
        // =========================================
        const ClickGame = {
            dur: 10, maxHp: 120, score: 0, state: 'idle', frame: 0, idle: null,
            imgs: ['assets/attack1.webp', 'assets/attack2.webp', 'assets/attack3.webp', 'assets/attack4.webp', 'assets/attack5.webp', 'assets/attack6.webp'],
            ranks: [
                {req: 120, n: "S級 神レベル", c: "#10b981"}, 
                {req: 90, n: "A級 達人", c: "#0ea5e9"}, 
                {req: 70, n: "B級 プロ", c: "#8b5cf6"},
                {req: 50, n: "C級 一般人", c: "#f59e0b"}, 
                {req: 0, n: "D級 初心者", c: "#ef4444"}
            ],
            els: { 
                t: document.getElementById('c_target'), img: document.getElementById('c_img'), 
                hp: document.getElementById('c_hp'), time: document.getElementById('c_time'), 
                sc: document.getElementById('c_score'), over: document.getElementById('c_result'), 
                fs: document.getElementById('c_rscore'), cps: document.getElementById('c_rcps'), 
                stamp: document.getElementById('c_rank_stamp'), btn: document.getElementById('c_start') 
            },
            
            init() {
                this.score = 0; this.state = 'idle'; clearTimeout(this.idle);
                this.els.sc.textContent = 0; this.els.time.textContent = this.dur.toFixed(1); 
                this.els.hp.style.width = '100%';
                
                this.els.img.classList.remove('explode');
                this.els.img.src = 'assets/enemy.webp';
                this.els.img.onerror = function() { this.src='enemy.webp'; };

                this.els.over.classList.remove('show'); 
                this.els.over.scrollTop = 0; 

                this.els.stamp.classList.remove('drop');
                this.els.btn.style.display = 'block';
                this.els.t.style.pointerEvents = 'none'; 
            },
            hit(e) {
                if (this.state !== 'playing') return;

                Engine.playHit();
                
                this.frame = (this.frame + 1) % this.imgs.length; 
                this.els.img.src = this.imgs[this.frame];
                this.els.img.onerror = function() { this.src = this.src.replace('assets/', ''); };

                this.els.t.classList.add('hit'); 
                void this.els.t.offsetWidth; 
                this.els.t.classList.remove('hit');
                
                clearTimeout(this.idle); 
                this.idle = setTimeout(() => { 
                    if(this.state === 'playing') this.els.img.src = 'assets/enemy.webp'; 
                }, 150);
                
                this.score++; this.els.sc.textContent = this.score;
                this.els.hp.style.width = `${Math.max(0, (this.maxHp - this.score) / this.maxHp * 100)}%`;
                
                const d = document.createElement('div'); d.textContent = "HIT!"; d.className = 'floating-damage';
                let x = e.clientX || (e.touches && e.touches[0].clientX) || window.innerWidth/2; 
                let y = e.clientY || (e.touches && e.touches[0].clientY) || window.innerHeight/2;
                const rect = this.els.t.getBoundingClientRect();
                d.style.left = `${x - rect.left - 30 + (Math.random()-0.5)*60}px`; 
                d.style.top = `${y - rect.top - 40}px`;
                this.els.t.appendChild(d); 
                setTimeout(()=>d.remove(), 500);
            },
            endGame() {
                this.state = 'ended';
                this.els.time.textContent = '0.0';
                this.els.t.style.pointerEvents = 'none';
                
                // サイバー爆発エフェクト
                this.els.img.classList.add('explode');
                
                // localStorageへの保存処理
                const currentBest = parseInt(localStorage.getItem('b_clk') || 0);
                if (this.score > currentBest) localStorage.setItem('b_clk', this.score);

                let rank = this.ranks[this.ranks.length-1];
                for(let r of this.ranks) { if(this.score >= r.req) { rank = r; break; } }

                const cps = (this.score / this.dur).toFixed(2);
                this.els.fs.textContent = this.score;
                this.els.cps.textContent = `${cps} Hits/sec`;
                
                this.els.stamp.textContent = `RANK: ${rank.n}`;
                this.els.stamp.style.color = rank.c;
                this.els.stamp.style.borderColor = rank.c;
                this.els.stamp.style.textShadow = `0 0 30px ${rank.c}`;

                setTimeout(() => {
                    this.els.over.classList.add('show');
                    
                    setTimeout(() => {
                        this.els.over.scrollTo({ top: this.els.over.scrollHeight / 2, behavior: 'smooth' });
                    }, 200);

                    setTimeout(() => {
                        this.els.stamp.classList.add('drop');
                    }, 300);
                }, 1500);
            }
        };

        let isTouching = false;
        ClickGame.els.t.addEventListener('touchstart', e => { e.preventDefault(); isTouching = true; ClickGame.hit(e); }, {passive: false});
        ClickGame.els.t.addEventListener('mousedown', e => { if(!isTouching) ClickGame.hit(e); });
        
        ClickGame.els.btn.addEventListener('click', () => {
            Engine.initAudio();
            ClickGame.init(); 
            ClickGame.els.btn.style.display = 'none';
            
            const overlay = document.getElementById('c_count_overlay');
            const textEl = document.getElementById('c_count_text');
            overlay.style.display = 'flex'; setTimeout(() => overlay.classList.add('show'), 10);
            let count = 3; textEl.textContent = count; textEl.style.animation = 'popIn 0.8s ease';
            
            const intv = setInterval(() => {
                count--;
                if (count > 0) {
                    textEl.textContent = count; textEl.style.animation = 'none'; void textEl.offsetWidth; textEl.style.animation = 'popIn 0.8s ease';
                } else {
                    clearInterval(intv); overlay.classList.remove('show'); setTimeout(() => overlay.style.display = 'none', 200);
                    
                    ClickGame.state = 'playing';
                    ClickGame.els.t.style.pointerEvents = 'auto'; 
                    let st = performance.now();
                    requestAnimationFrame(function loop(cur) {
                        if(ClickGame.state !== 'playing') return;
                        let left = ClickGame.dur - (cur - st)/1000;
                        if(left <= 0) { ClickGame.endGame(); } 
                        else { ClickGame.els.time.textContent = left.toFixed(1); requestAnimationFrame(loop); }
                    });
                }
            }, 1000);
        });

        document.getElementById('c_retry').addEventListener('click', () => {
            ClickGame.init();
            ClickGame.els.btn.style.display = 'block';
        });

        ClickGame.init();
    </script>
</body>
</html>
