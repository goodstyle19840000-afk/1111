<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>総合力パラメーター - CORE ANALYZER</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --accent-blue: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.6);
            --bg-dark: #020617;
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --highlight: #f0abfc;
        }

        /* 👑 iPhone Safari対策: 全要素で長押しメニューを禁止し、操作性を確保 */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Helvetica Neue', Arial, sans-serif;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* 👑 iPhoneのバーを考慮した100dvh設定 */
        body { 
            background: var(--bg-dark); color: var(--text-main); 
            min-height: 100dvh; overflow-x: hidden; 
            display: flex; flex-direction: column; align-items: center;
        }

        /* =========================================
           👑 背景不動レイヤー・スライドショー設定
           ========================================= */
        /* 背景専用の親Container（スタック文脈を作成） */
        #bgContainer {
            position: fixed !important; inset: 0 !important;
            width: 100% !important; height: 100dvh !important;
            z-index: -2; /* 通常モード時はパネル(z:auto)の奥 */
            pointer-events: none; /* コンテンツのクリックを邪魔しない */
            overflow: hidden; will-change: transform;
        }

        .bg-layer {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            background-size: cover; background-position: center center; background-repeat: no-repeat;
            filter: blur(25px) brightness(0.35); 
            transform: scale(1.15);
            /* opacityとz-indexはJSで制御、transitionはここ */
            transition: opacity 2s ease-in-out, filter 0.6s, transform 0.6s, background-size 0.6s;
            will-change: transform, opacity;
        }

        /* 👑 のぞき見（隠しコマンド）発動時 */
        body.view-bg #bgContainer { 
            z-index: 1000 !important; /* パネル(auto)より前。リザルト(2000)、戻る(3000)より後。 */
        }
        body.view-bg .bg-layer { 
            background-size: contain !important; /* 画像の左右を絶対に切らない */
            filter: blur(0) brightness(0.9) !important; 
            transform: scale(1.0) !important; 
            /* 👑 修正: opacity: 1 !important; を削除し、JSによるフェード制御を有効化 */
            background-color: #000; /* 余白は映画のように黒で締める */
        }

        .scanlines {
            position: fixed; inset: 0; z-index: -1;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px; pointer-events: none;
        }

        header { width: 100%; padding: 30px 20px 10px; text-align: center; z-index: 10; transition: opacity 0.5s; }
        .app-id { font-size: 0.7rem; color: var(--accent-blue); letter-spacing: 5px; font-weight: bold; margin-bottom: 5px; opacity: 0.8; }
        .app-title { font-size: 1.7rem; font-weight: bold; text-shadow: 0 0 20px var(--accent-glow); letter-spacing: 2px; }

        .dashboard { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 15px; padding: 15px; z-index: 10; transition: opacity 0.5s; }
        @media (min-width: 850px) { .dashboard { flex-direction: row; } }

        .panel {
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); flex: 1; position: relative; overflow: hidden;
        }

        /* スキャンパルスグリッド（波紋） */
        .panel::before {
            content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 50px; height: 50px; background: transparent; 
            border: 2px solid var(--accent-blue); border-radius: 50%;
            box-shadow: 0 0 30px var(--accent-blue);
            opacity: 0; animation: scanPulse 3s infinite cubic-bezier(0.1, 0.5, 0.5, 1); z-index: -1;
        }
        .panel::after {
            content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 50px; height: 50px; background: transparent; 
            border: 1px solid var(--accent-blue); border-radius: 50%;
            opacity: 0; animation: scanPulse 3s infinite 1.5s cubic-bezier(0.1, 0.5, 0.5, 1); z-index: -1;
        }
        @keyframes scanPulse { 
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0; } 
            20% { opacity: 0.6; } 
            100% { transform: translate(-50%, -50%) scale(8); opacity: 0; } 
        }

        .chart-container { position: relative; width: 100%; height: 280px; filter: drop-shadow(0 0 10px var(--accent-glow)); }

        .status-panel { text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* 現在値(強調) / 最大値(小さめ) 表示 */
        .total-power-value { font-size: 4.8rem; font-weight: 900; color: #fff; line-height: 1; margin: 10px 0; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; justify-content: center; }
        .max-denominator { font-size: 1.5rem; color: var(--text-dim); margin-left: 5px; font-weight: 400; opacity: 0.6; }
        
        .rank-title-box { 
            padding: 15px; background: linear-gradient(90deg, rgba(14, 165, 233, 0.1), transparent);
            border-radius: 12px; border-left: 5px solid var(--accent-blue); text-align: left;
        }
        .rank-label { font-size: 0.75rem; color: var(--accent-blue); font-weight: 800; margin-bottom: 5px; }
        .rank-value { font-size: 1.4rem; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 10px; }

        .strong-point-badge {
            margin-top: 15px; font-size: 0.85rem; font-weight: bold; color: var(--highlight);
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 15px;
            background: rgba(240, 171, 252, 0.1); border-radius: 50px; border: 1px solid var(--highlight);
            animation: fadeIn 1s;
        }

        /* メニューグリッド */
        .menu-grid {
            width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 15px 40px; z-index: 10; transition: opacity 0.5s;
        }
        @media (min-width: 600px) { .menu-grid { grid-template-columns: repeat(4, 1fr); } }

        /* カーソル・タップ強調 */
        .menu-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px;
            text-decoration: none; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center; cursor: pointer;
        }
        .menu-card:hover { 
            transform: translateY(-8px) scale(1.05); 
            background: rgba(255, 255, 255, 0.1); 
            border-color: #fff; 
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.4); 
            filter: brightness(1.2);
        }
        .menu-card:active { transform: scale(0.95); }

        .menu-icon { font-size: 2rem; margin-bottom: 8px; filter: drop-shadow(0 0 8px rgba(255,255,255,0.2)); }
        .menu-title { font-size: 0.8rem; font-weight: bold; color: var(--text-dim); }
        .menu-score { font-size: 1.1rem; font-weight: 800; margin-top: 4px; color: #fff; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="bgContainer">
        <div class="bg-layer" id="bg1"></div>
        <div class="bg-layer" id="bg2"></div>
    </div>
    <div class="scanlines"></div>

    <header>
        <div class="app-id">CORE_SYSTEM_v3.0</div>
        <h1 class="app-title">総合力パラメーター</h1>
    </header>

    <div class="dashboard">
        <div class="panel">
            <div class="chart-container">
                <canvas id="radarChart"></canvas>
            </div>
        </div>

        <div class="panel status-panel">
            <div>
                <div class="total-power-label" style="font-size:0.75rem; color:var(--text-dim); letter-spacing:2px;">OVERALL INDEX</div>
                <div class="total-power-value">
                    <span id="totalScoreText">0</span><span class="max-denominator">/ 400</span>
                </div>
            </div>
            
            <div class="rank-title-box">
                <div class="rank-label">ASSIGNED TITLE</div>
                <div class="rank-value" id="titleText">Analyzing...</div>
            </div>

            <div id="strongPoint" class="strong-point-badge" style="display:none;">
                ⭐ 特化能力: <span id="strongPointName">---</span>
            </div>

            <div id="adviceText" style="margin-top:15px; font-size:0.85rem; color:var(--text-dim); text-align:left; line-height:1.6;">
                全セクターの試験を完了し、パーソナルプロファイルを構築してください。
            </div>
        </div>
    </div>

    <div class="menu-grid">
        <a href="quiz.html" class="menu-card">
            <div class="menu-icon">🧠</div>
            <div class="menu-title">ビジネス知識</div>
            <div class="menu-score" id="m_quiz">---</div>
        </a>
        <a href="click.html" class="menu-card">
            <div class="menu-icon">🎯</div>
            <div class="menu-title">処理能力</div>
            <div class="menu-score" id="m_click">---</div>
        </a>
        <a href="reaction.html" class="menu-card">
            <div class="menu-icon">⚡</div>
            <div class="menu-title">反射決断</div>
            <div class="menu-score" id="m_react">---</div>
        </a>
        <a href="time.html" class="menu-card">
            <div class="menu-icon">⏱️</div>
            <div class="menu-title">時間管理</div>
            <div class="menu-score" id="m_time">---</div>
        </a>
    </div>

    <script>
        // =========================================
        // 💾 データ取得と計算
        // =========================================
        const getS = (k, d=0) => localStorage.getItem(k) || d;
        const raw = { quiz: parseInt(getS('b_quiz')), click: parseInt(getS('b_clk')), react: parseFloat(getS('b_rea')), time: parseFloat(getS('b_tim')) };

        const ptQuiz  = raw.quiz * 10;
        const ptClick = Math.min(100, (raw.click / 120) * 100);
        const ptReact = raw.react === 0 ? 0 : Math.max(0, Math.min(100, (0.40 - raw.react) / (0.40 - 0.15) * 100));
        const ptTime  = raw.time === 0 ? 0 : Math.max(0, Math.min(100, (1.0 - raw.time) / 1.0 * 100));

        if(raw.quiz > 0) document.getElementById('m_quiz').innerText = `${raw.quiz}/10`;
        if(raw.click > 0) document.getElementById('m_click').innerText = `${raw.click}`;
        if(raw.react > 0) document.getElementById('m_react').innerText = `${raw.react.toFixed(3)}s`;
        if(raw.time > 0) document.getElementById('m_time').innerText = `±${raw.time.toFixed(3)}s`;

        const total = Math.floor(ptQuiz + ptClick + ptReact + ptTime);
        document.getElementById('totalScoreText').innerText = total;

        const pts = [ {n:"知識", v:ptQuiz, i:"🧠"}, {n:"処理", v:ptClick, i:"🎯"}, {n:"決断", v:ptReact, i:"⚡"}, {n:"計画", v:ptTime, i:"⏱️"} ];
        const highest = [...pts].sort((a,b)=>b.v-a.v)[0];
        if(total > 0) {
            let t = "👶 期待の新人";
            if(total >= 350) t = "👑 伝説の執行役員";
            else if(total >= 280) t = "⚔️ 無双のマネージャー";
            else if(total >= 200) t = "🛠️ 敏腕スペシャリスト";
            else if(total >= 100) t = "📈 成長株プレイヤー";

            if(highest.v >= 85) {
                document.getElementById('strongPoint').style.display = "inline-flex";
                document.getElementById('strongPointName').innerText = highest.n;
                if(highest.n==="知識") t="📜 沈着冷静な軍師";
                if(highest.n==="処理") t="🚀 超速の事務処理官";
                if(highest.n==="決断") t="⚡ 直感型の勝負師";
                if(highest.n==="計画") t="⏱️ 精密なる時計職人";
            }
            document.getElementById('titleText').innerText = t;
            document.getElementById('adviceText').innerText = `あなたの最大の武器は「${highest.n}」です。この能力を軸に戦略を組み立ててください。`;
        }

        // =========================================
        // 📊 レーダーチャート (Chart.js)
        // =========================================
        const ctx = document.getElementById('radarChart').getContext('2d');
        new Chart(ctx, {
            type: 'radar',
            data: {
                labels: pts.map(p => `${p.i} ${p.n}\n${Math.floor(p.v)}pt`),
                datasets: [{
                    data: [ptQuiz, ptClick, ptReact, ptTime],
                    backgroundColor: 'rgba(14, 165, 233, 0.25)',
                    borderColor: '#0ea5e9',
                    borderWidth: 4,
                    pointBackgroundColor: '#fff',
                    pointBorderColor: '#0ea5e9',
                    pointRadius: 5,
                    pointHoverRadius: 8,
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    r: {
                        angleLines: { color: 'rgba(255,255,255,0.2)', lineWidth: 1 },
                        grid: { color: 'rgba(255,255,255,0.1)', circular: circular=true },
                        pointLabels: { color: '#e2e8f0', font: { size: 11, weight: 'bold' }, padding: 15 },
                        ticks: { display: false, min: 0, max: 100, stepSize: 25 },
                        suggestedMin: 0, suggestedMax: 100
                    }
                },
                plugins: { legend: { display: false } },
                animation: { duration: 2000, easing: 'easeOutQuart' }
            }
        });

        // =========================================
        // 🖼️ 背景クロスフェード・スライドショー
        // =========================================
        const bgs = [document.getElementById('bg1'), document.getElementById('bg2')];
        let currentBgIdx = 0; // 最初はbg1

        // 👑 デバイス判定関数を追加
        function getDevicePath() {
            return window.innerWidth <= 768 ? 'bg/sp/' : 'bg/pc/';
        }

        // 👑 修正: 初期状態設定関数（DOM順に関わらず、bg1を上にして表示）
        function initAppBg() {
            const randomNum = Math.floor(Math.random() * 195) + 1;
            const folder = getDevicePath(); // フォルダを自動判定
            const imgUrl = `${folder}bg (${randomNum}).webp`; // パスを結合
            bgs[0].style.backgroundImage = `url('${imgUrl}')`;
            
            // ★重要: JSで style 属性を操作し、初期状態を確定させる
            bgs[0].style.opacity = 1;
            bgs[0].style.zIndex = 1; // bg1を上に
            bgs[1].style.opacity = 0;
            bgs[1].style.zIndex = 0; // bg2を下に
        }

        function updateBg() {
            const nextIdx = (currentBgIdx + 1) % 2; // フェードインしてくる次の画像（bg2 -> bg1 -> ...）
            const randomNum = Math.floor(Math.random() * 195) + 1;
            const folder = getDevicePath(); // フォルダを自動判定
            const img = new Image();
            img.src = `${folder}bg (${randomNum}).webp`; // パスを結合
            img.onload = () => {
                bgs[nextIdx].style.backgroundImage = `url('${img.src}')`;
                
                // 👑 修正: ★z-index制御：これからフェードインする「次の画像」を常に上にする★
                // これにより、のぞき見モード（blurなし）でも美しいクロスフェードが見える
                bgs[nextIdx].style.zIndex = 1; // style属性で指定
                bgs[currentBgIdx].style.zIndex = 0; // style属性で指定

                // opacityを切り替えてフェード演出（CSS transitionが適用される）
                bgs[nextIdx].style.opacity = 1; // フェードイン
                bgs[currentBgIdx].style.opacity = 0; // フェードアウト
                
                currentBgIdx = nextIdx;
            };
        }
        
        // ページロード時に初期画像をパッと表示
        initAppBg();
        // 4秒後からスライドショーを開始
        setInterval(updateBg, 4000);

        // =========================================
        // 👆 隠しコマンド：のぞき見機能 (iPhone Safari完全対応)
        // =========================================
        const triggerPeek = (e) => {
            // パネルやチャートの上では発動させない
            if (e.target.closest('.menu-card') || e.target.closest('canvas')) return;
            document.body.classList.add('view-bg');
        };
        const endPeek = () => document.body.classList.remove('view-bg');

        // iOS Safariの「長押しメニュー」を殺し、自作のぞき見を優先
        window.addEventListener('touchstart', triggerPeek, { passive: true });
        window.addEventListener('touchend', endPeek, { passive: true });
        window.addEventListener('mousedown', triggerPeek);
        window.addEventListener('mouseup', endPeek);
        // 右クリックメニュー禁止（隠しコマンド保護）
        window.oncontextmenu = (e) => { e.preventDefault(); e.stopPropagation(); return false; };
    </script>
</body>
</html>
