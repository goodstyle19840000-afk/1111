<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>詳細解析レポート - CORE ANALYZER PRO</title>
    <style>
        :root {
            --bg-dark: #020617;
            --accent: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.4);
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --glass: rgba(15, 23, 42, 0.85);
            --border: rgba(255, 255, 255, 0.1);
            --danger: #f43f5e;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); min-height: 100dvh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .scanlines { position: fixed; inset: 0; z-index: -1; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%); background-size: 100% 4px; pointer-events: none; }

        .container { width: 100%; max-width: 850px; display: flex; flex-direction: column; gap: 20px; }

        .header { text-align: center; padding: 20px 0; }
        .header h1 { font-size: 1.4rem; letter-spacing: 6px; color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); }
        .back-btn { display: inline-block; margin-top: 10px; color: var(--text-dim); text-decoration: none; font-size: 0.8rem; transition: 0.3s; }
        .back-btn:hover { color: #fff; }

        .report-card { background: var(--glass); border: 1px solid var(--border); border-radius: 28px; padding: 35px; backdrop-filter: blur(15px); box-shadow: 0 20px 50px rgba(0,0,0,0.6); position: relative; }
        
        .type-badge { display: inline-block; background: var(--accent); color: #000; padding: 5px 15px; border-radius: 4px; font-weight: 900; font-size: 0.8rem; margin-bottom: 12px; }
        .type-name { font-size: 2.2rem; font-weight: bold; margin-bottom: 20px; letter-spacing: -1px; display: flex; align-items: center; gap: 15px; }

        .section-title { font-size: 0.9rem; color: var(--accent); font-weight: bold; margin: 35px 0 15px; display: flex; align-items: center; gap: 10px; border-left: 4px solid var(--accent); padding-left: 12px; }

        .description { font-size: 1.05rem; line-height: 1.8; color: var(--text-dim); margin-bottom: 20px; }
        .description strong { color: #fff; border-bottom: 1px solid var(--accent); }

        /* 性格診断グリッド */
        .trait-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .trait-item { background: rgba(255,255,255,0.03); padding: 22px; border-radius: 16px; border: 1px solid var(--border); position: relative; }
        .trait-label { font-size: 0.85rem; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .trait-text { font-size: 0.95rem; line-height: 1.6; color: var(--text-main); }
        
        .label-pros { color: var(--success); }
        .label-cons { color: var(--danger); }

        /* 数値分析 */
        .stat-bar-container { margin-bottom: 18px; }
        .stat-info { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-dim); align-items: center; }
        .stat-icon { margin-right: 8px; font-size: 1.1rem; }
        .stat-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .stat-bar-fill { height: 100%; background: var(--accent); box-shadow: 0 0 15px var(--accent-glow); transition: width 1.8s cubic-bezier(0.19, 1, 0.22, 1); width: 0; }

        .advice-box { background: rgba(14, 165, 233, 0.05); padding: 25px; border-radius: 18px; font-size: 0.95rem; line-height: 1.8; color: var(--text-main); border: 1px dashed var(--accent-glow); position: relative; }
        .advice-box::before { content: '💡 ADVICE'; position: absolute; top: -10px; left: 20px; background: var(--bg-dark); padding: 0 10px; font-size: 0.7rem; font-weight: bold; color: var(--accent); }

        .tag { background:rgba(255,255,255,0.05); border:1px solid var(--border); padding:10px 18px; border-radius:50px; font-size:0.85rem; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .tag:hover { background: rgba(14, 165, 233, 0.1); border-color: var(--accent); }

        @media (max-width: 600px) { .trait-grid { grid-template-columns: 1fr; } .type-name { font-size: 1.8rem; } }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div class="container">
        <div class="header">
            <h1>DEEP BEHAVIORAL ANALYSIS</h1>
            <a href="index.html" class="back-btn">⬅ ポータルへ戻る</a>
        </div>

        <div class="report-card">
            <div id="reportContent">
                <div class="type-badge" id="classLabel">ANALYZING...</div>
                <h2 class="type-name">
                    <span id="typeIcon">🧬</span>
                    <span id="className">プロファイル生成中</span>
                </h2>
                
                <p class="description" id="classDesc">
                    全セクターのデータを統合し、あなたの認知特性と潜在的な性格傾向を抽出しています。
                </p>

                <div class="trait-grid">
                    <div class="trait-item">
                        <div class="trait-label label-pros">✨ 強みと得意なこと</div>
                        <div class="trait-text" id="prosText">---</div>
                    </div>
                    <div class="trait-item">
                        <div class="trait-label label-cons">⚠️ 弱点と注意点</div>
                        <div class="trait-text" id="consText">---</div>
                    </div>
                </div>

                <div class="section-title">ポテンシャル推計</div>
                <div class="stat-bar-container">
                    <div class="stat-info"><span><span class="stat-icon">⚖️</span>意思決定の正確性</span><span id="val_accuracy">0%</span></div>
                    <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar_accuracy"></div></div>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-info"><span><span class="stat-icon">🔋</span>ストレス耐性</span><span id="val_stress">0%</span></div>
                    <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar_stress"></div></div>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-info"><span><span class="stat-icon">🔀</span>並列処理能力</span><span id="val_multi">0%</span></div>
                    <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar_multi"></div></div>
                </div>

                <div class="section-title">今後のための提言</div>
                <div class="advice-box" id="adviceBox">
                    データを蓄積することで、より具体的な改善アドバイスが生成されます。
                </div>

                <div class="section-title">推奨キャリアパス</div>
                <div id="positionTags" style="display:flex; flex-wrap:wrap; gap:10px; margin-top: 10px;">
                    </div>
            </div>
        </div>
    </div>

    <script>
        const getS = (k, d=0) => localStorage.getItem(k) || d;
        const scores = {
            quiz: parseInt(getS('b_quiz')) * 10,
            click: Math.min(100, (parseInt(getS('b_clk')) / 120) * 100),
            react: getS('b_rea') == 0 ? 0 : Math.max(0, Math.min(100, (0.40 - parseFloat(getS('b_rea'))) / (0.40 - 0.15) * 100)),
            time: getS('b_tim') == 0 ? 0 : Math.max(0, Math.min(100, (1.0 - parseFloat(getS('b_tim'))) / 1.0 * 100)),
            obs: Math.min(100, (parseInt(getS('b_obs')) / 40) * 100),
            log: Math.min(100, (parseInt(getS('b_log')) / 40) * 100)
        };

        const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
        const top1 = sorted[0];
        const top2 = sorted[1];

        const detailedAnalysis = {
            quiz: {
                name: "アーキビスト", icon: "📚",
                pros: "膨大なデータベースを脳内に構築しており、過去の事例や知識に基づいた**「最も手堅い正解」**を導き出すのが得意です。",
                cons: "前例のない未知のトラブルや、直感的なスピードが求められる場面では、情報の精査に時間をかけすぎてしまう傾向があります。",
                advice: "「完璧な知識」を待つのではなく、手持ちの情報だけで60点の回答を出すスピード感を意識すると、さらに飛躍できます。",
                tags: ["📜 歴史編纂者", "💼 弁理士", "🤖 AI学習監修"]
            },
            click: {
                name: "アクセラレーター", icon: "🚀",
                pros: "圧倒的な実行力。目の前のタスクを機械的な正確さで処理し続けることができ、**「泥臭い完遂」**において組織の要となります。",
                cons: "「なぜこれをするのか」という大局的な視点が疎かになりやすく、ルーチン化できない複雑な抽象概念の処理を苦手とします。",
                advice: "作業の合間に5分だけ「全体の地図」を見る時間を作りましょう。その速度に戦略が加われば無敵です。",
                tags: ["🏭 生産管理", "⚔️ 執行役員", "💉 外科医"]
            },
            react: {
                name: "ニューラル・センサー", icon: "⚡",
                pros: "反射神経と危機察知能力。違和感に即座に反応し、**「手遅れになる前に手を打つ」**瞬発力は、現場の守護神と言えます。",
                cons: "常に神経を張っているため消耗が激しく、長期的なスパンでじっくりと計画を練り、育てるような忍耐が必要な作業はストレスになります。",
                advice: "オンとオフの切り替えを物理的に強制してください。高い覚醒度は、深い休息があってこそ維持されます。",
                tags: ["🚨 危機管理監", "✈️ パイロット", "💹 ディーラー"]
            },
            time: {
                name: "タイム・キーパー", icon: "⏱️",
                pros: "驚異的な自己規律。外的要因に左右されない強固な内的リズムを持ち、**「締め切りや約束を絶対に守る」**という絶大な信頼を勝ち取ります。",
                cons: "予測不能なスケジュールの変更や、ルーズな他者との協働において強いストレスを感じ、柔軟性を欠いてしまうことがあります。",
                advice: "「あえて予定を決めない日」を作り、カオスな状況を楽しむ訓練をすると、あなたの精密さはさらに輝きます。",
                tags: ["🎼 指揮者", "⌚ 精密時計職人", "📡 管制官"]
            },
            obs: {
                name: "ゴースト・アイ", icon: "👁️",
                pros: "微細な差異を見抜く「神の視点」。他の人が見落とす致命的なミスや、成功の鍵となる小さな予兆を**「直感的」**に捉えることができます。",
                cons: "細部にこだわりすぎて、プロジェクトの全体進捗を遅らせてしまったり、他人の小さなミスを指摘しすぎてしまう傾向があります。",
                advice: "「見逃しても死なないミス」を許容する練習をしましょう。あなたの視力は、重要な場面のために温存すべきです。",
                tags: ["🎨 美術鑑定士", "🐛 デバッグ専門官", "⚖️ 検察官"]
            },
            log: {
                name: "ロジック・プロセッサ", icon: "🧠",
                pros: "構造的思考の達人。複雑に絡み合った問題を論理の糸で解きほぐし、**「誰もが納得する仕組み」**を作り上げる設計能力に長けています。",
                cons: "感情的な側面や、理屈では説明できない「人の心」の機微を計算から除外してしまい、正論で周囲を凍りつかせることがあります。",
                advice: "論理は「武器」ではなく「地図」です。人を動かすには、正しい理屈以上に、共感というガソリンが必要なことを忘れないでください。",
                tags: ["🏢 CTO / 設計者", "🔭 理論物理学者", "♟️ 戦略家"]
            }
        };

        window.onload = () => {
            const mainType = top1[0];
            const subType = top2[0];
            
            if (mainType === 'none' || top1[1] === 0) {
                document.getElementById('className').innerText = "未解析の被検体";
                return;
            }

            const data = detailedAnalysis[mainType];

            // 1. 基本情報の更新
            document.getElementById('typeIcon').innerText = data.icon;
            document.getElementById('className').innerText = data.name;
            document.getElementById('classLabel').innerText = `MAIN: ${mainType.toUpperCase()} / SUB: ${subType.toUpperCase()}`;
            document.getElementById('prosText').innerHTML = data.pros;
            document.getElementById('consText').innerHTML = data.cons;
            document.getElementById('adviceBox').innerHTML = data.advice;

            // 2. 数値演出
            const acc = Math.floor((scores.quiz + scores.log) / 2) || 40;
            const str = Math.floor((scores.time + scores.react) / 2) || 40;
            const mul = Math.floor((scores.click + scores.obs) / 2) || 40;

            const updateBar = (id, val) => {
                document.getElementById('val_' + id).innerText = val + '%';
                document.getElementById('bar_' + id).style.width = val + '%';
            };
            setTimeout(() => {
                updateBar('accuracy', acc);
                updateBar('stress', str);
                updateBar('multi', mul);
            }, 300);

            // 3. キャリアタグ生成
            const tagContainer = document.getElementById('positionTags');
            data.tags.forEach(t => {
                const span = document.createElement('span');
                span.className = 'tag';
                span.innerText = t;
                tagContainer.appendChild(span);
            });
        };
    </script>
</body>
</html>
