<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>データ・アーカイブ - CORE ANALYZER</title>
    <style>
        /* =========================================
           1. 基本設定＆カラーパレット
           ========================================= */
        :root {
            --bg-dark: #020617;
            --bg-gradient: linear-gradient(135deg, #020617, #1e1b4b, #020617);
            --glass-bg: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent-color: #0ea5e9; 
            --accent-glow: rgba(14, 165, 233, 0.7);
            --success-color: #10b981;
            --success-glow: rgba(16, 185, 129, 0.8);
            --warning-color: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; user-select: none; -webkit-touch-callout: none; }
        
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100dvh; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; padding-bottom: 20px; }
        .scanlines { position: fixed; inset: 0; z-index: -1; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%); background-size: 100% 4px; pointer-events: none; }

        /* =========================================
           2. ヘッダー＆コントロール
           ========================================= */
        .top-nav { width: 100%; max-width: 1000px; padding: 20px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .back-btn { display: inline-flex; align-items: center; gap: 5px; color: #fff; text-decoration: none; font-size: 0.9rem; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 20px; border: 1px solid var(--glass-border); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: transform 0.2s; }
        .back-btn:active { transform: scale(0.95); }

        .ap-display { background: rgba(14, 165, 233, 0.15); border: 1px solid var(--accent-color); padding: 8px 18px; border-radius: 20px; font-weight: bold; color: #fff; text-shadow: 0 0 10px var(--accent-glow); font-size: 0.9rem; }
        .ap-display span { color: var(--accent-color); font-size: 1.2rem; margin-right: 5px; font-variant-numeric: tabular-nums; }

        .dashboard { width: 100%; max-width: 1000px; padding: 0 15px 15px; display: flex; flex-direction: column; gap: 15px; z-index: 10; }
        .control-panel { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); gap: 15px; }
        @media (max-width: 600px) { .control-panel { flex-direction: column; text-align: center; } }

        .control-info h2 { font-size: 1.2rem; margin-bottom: 5px; }
        .control-info p { font-size: 0.85rem; color: var(--text-dim); }
        .btn-group { display: flex; gap: 10px; flex-shrink: 0; }
        .action-btn { padding: 12px 20px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; transition: transform 0.2s; display: flex; align-items: center; gap: 5px; font-size: 0.9rem; }
        .reset-btn { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--glass-border); }
        .reset-btn:active { transform: scale(0.95); }

        /* =========================================
           3. ギャラリー・グリッド
           ========================================= */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; width: 100%; max-width: 1000px; padding: 0 15px 80px; z-index: 10; }
        @media (min-width: 600px) { .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; } }

        .gallery-item { aspect-ratio: 9/16; border-radius: 12px; overflow: hidden; position: relative; cursor: pointer; background: #010409; border: 1px solid var(--glass-border); box-shadow: 0 5px 15px rgba(0,0,0,0.4); transition: transform 0.2s, border-color 0.2s; }
        .gallery-item:not(.locked):hover { transform: translateY(-3px); border-color: var(--accent-color); box-shadow: 0 10px 25px rgba(14, 165, 233, 0.4); }
        @media (min-width: 769px) { .gallery-item { aspect-ratio: 16/9; } }

        .gallery-item img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; transition: opacity 0.3s; }
        .gallery-item:not(.locked):hover img { opacity: 1; }

        .gallery-item.locked { cursor: not-allowed; border-style: dashed; border-color: #334155; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #475569; }
        .locked-icon { font-size: 1.8rem; margin-bottom: 5px; opacity: 0.4; }
        .locked-id { font-size: 0.7rem; font-weight: bold; letter-spacing: 1px; }

        .gallery-item.active { border: 2px solid var(--success-color); box-shadow: 0 0 20px var(--success-glow); }
        .gallery-item.active img { opacity: 1; }
        .gallery-item.active::after { content: '✓ FIXED'; position: absolute; top: 8px; right: 8px; background: var(--success-color); color: #fff; font-size: 0.6rem; font-weight: bold; padding: 3px 8px; border-radius: 5px; }

        /* =========================================
           4. 👑 ガチャボタン（最下部）
           ========================================= */
        .gacha-footer { position: fixed; bottom: 0; left: 0; width: 100%; padding: 15px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); backdrop-filter: blur(10px); z-index: 1000; display: flex; justify-content: center; border-top: 1px solid var(--glass-border); }
        .gacha-btn-fixed { width: 100%; max-width: 500px; padding: 18px; border-radius: 50px; font-size: 1.2rem; font-weight: bold; color: #fff; background: var(--success-color); border: 2px solid rgba(255,255,255,0.3); box-shadow: 0 5px 20px var(--success-glow); cursor: pointer; transition: transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .gacha-btn-fixed:active { transform: scale(0.96); }
        .gacha-btn-fixed:disabled { background: #334155; color: #94a3b8; box-shadow: none; cursor: not-allowed; border-color: transparent; }

        /* =========================================
           5. 👑 ド派手モーダル
           ========================================= */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; padding: 20px; pointer-events: none; }
        .modal-overlay.show { display: flex; opacity: 1; pointer-events: auto; }

        /* サイバー背景 */
        .modal-overlay::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(var(--glass-border) 1px, transparent 1px), linear-gradient(90deg, var(--glass-border) 1px, transparent 1px); background-size: 40px 40px; background-position: center; opacity: 0.15; }

        .modal-content { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 15px; align-items: center; z-index: 10; transform: scale(0.95); transition: transform 0.3s; }
        .modal-overlay.show .modal-content { transform: scale(1); }

        .image-container { position: relative; width: 100%; border-radius: 20px; overflow: hidden; border: 2px solid var(--glass-border); background: #000; box-shadow: 0 10px 40px rgba(0,0,0,0.8); transition: border-color 0.5s, box-shadow 0.5s; }
        .modal-overlay.decoded .image-container { border-color: var(--success-color); box-shadow: 0 0 30px var(--success-glow); }

        /* 👑 画像アニメーション（バグ修正済） */
        .modal-img { width: 100%; max-height: 65vh; object-fit: contain; display: block; opacity: 0; filter: blur(15px) brightness(2); transform: scale(1.1); transition: opacity 0.6s ease-out, filter 0.6s ease-out, transform 0.6s ease-out; }
        .modal-overlay.decoded .modal-img { opacity: 1; filter: blur(0) brightness(1); transform: scale(1); }

        .modal-actions { display: flex; gap: 12px; width: 100%; opacity: 0; transform: translateY(20px); transition: opacity 0.3s 0.2s, transform 0.3s 0.2s; }
        .modal-overlay.decoded .modal-actions { opacity: 1; transform: translateY(0); }

        .modal-btn { flex: 1; padding: 16px; border-radius: 50px; font-weight: bold; border: none; cursor: pointer; font-size: 1rem; transition: transform 0.1s; }
        .modal-btn:active { transform: scale(0.95); }
        .btn-set { background: var(--success-color); color: #fff; box-shadow: 0 4px 15px var(--success-glow); }
        .btn-close { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--glass-border); }

        /* =========================================
           👑 デコード画面演出
           ========================================= */
        .decoding-screen { position: absolute; inset: 0; background: #000; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--accent-color); overflow: hidden; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .decoding-screen.active { opacity: 1; pointer-events: auto; }

        /* サイバーリング */
        .cyber-ring { position: absolute; width: 300px; height: 300px; border-radius: 50%; border: 2px dashed var(--accent-color); filter: drop-shadow(0 0 15px var(--accent-glow)); animation: ringRotate 8s linear infinite; opacity: 0.5; }
        @keyframes ringRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .decode-info { position: relative; z-index: 30; text-align: center; width: 100%; }
        .decode-text { font-size: 2.2rem; font-weight: 900; color: #fff; text-shadow: 0 0 10px #fff, 0 0 20px var(--accent-color); animation: glitchText 0.3s infinite; letter-spacing: 3px; line-height: 1.2; }
        @keyframes glitchText { 0% { transform: translate(0,0); } 50% { transform: translate(-3px, 2px); color: var(--warning-color); } 100% { transform: translate(3px, -2px); } }
        .random-hash { font-family: monospace; margin-top: 20px; font-size: 0.9rem; word-break: break-all; max-width: 85%; margin-left: auto; margin-right: auto; }

        /* 👑 ホワイトフラッシュ */
        .flash-overlay { position: fixed; inset: 0; background: #fff; z-index: 20000; opacity: 0; pointer-events: none; transition: opacity 0.4s ease-out; }
        .flash-overlay.active { opacity: 1; transition: none; }

    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="flash-overlay" id="flashOverlay"></div>

    <div class="top-nav">
        <a href="index.html" class="back-btn">⬅ ポータルへ戻る</a>
        <div class="ap-display"><span id="apAmount">0</span> AP</div>
    </div>

    <div class="dashboard">
        <div class="control-panel">
            <div class="control-info">
                <h2>DATA ARCHIVE</h2>
                <p>解析ポイント(AP)を消費し、量子暗号データを復元します。<br>復元状況: <strong id="unlockCount">0</strong> / 200</p>
            </div>
            <div class="btn-group">
                <button class="action-btn reset-btn" id="resetBtn">🔄 ランダム表示に戻す</button>
            </div>
        </div>
    </div>

    <div class="gallery-grid" id="galleryGrid"></div>

    <div class="gacha-footer">
        <button class="gacha-btn-fixed" id="gachaBtn">🔓 量子復号を開始 (100 AP)</button>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="image-container">
                <img src="" class="modal-img" id="modalImg">
                
                <div class="decoding-screen" id="decodingScreen">
                    <div class="cyber-ring"></div>
                    <div id="particleContainer" style="position:absolute; inset:0; pointer-events:none;"></div>
                    
                    <div class="decode-info">
                        <div class="decode-text">QUANTUM<br>DECODING</div>
                        <div id="randomHash" class="random-hash"></div>
                    </div>
                </div>
            </div>
            
            <div class="modal-actions" id="modalActions">
                <button class="modal-btn btn-close" id="modalClose">✕ 閉じる</button>
                <button class="modal-btn btn-set" id="modalSet">🖥️ この背景を固定</button>
            </div>
        </div>
    </div>

    <script>
        const TOTAL_IMAGES = 200;
        const GACHA_COST = 100;
        function getDevicePath() { return window.innerWidth <= 768 ? 'bg/sp/' : 'bg/pc/'; }

        // =========================================
        // 🔧 Audio Engine
        // =========================================
        const Engine = {
            ctx: null,
            init() { 
                try {
                    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); 
                    if (this.ctx.state === 'suspended') this.ctx.resume();
                } catch(e) {}
            },
            playGachaStart() {
                if(!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sawtooth'; 
                osc.frequency.setValueAtTime(30, now); osc.frequency.exponentialRampToValueAtTime(150, now + 1.4);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.3, now + 0.1); gain.gain.linearRampToValueAtTime(0, now + 1.5);
                osc.start(now); osc.stop(now + 1.5);
            },
            playDecoded() {
                if(!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(1500, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            },
            playSet() {
                if(!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, this.ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(1000, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.start(); osc.stop(this.ctx.currentTime + 0.15);
            }
        };

        // =========================================
        // ✨ Web Animations API による絶対動くパーティクル
        // =========================================
        const ParticleEngine = {
            container: document.getElementById('particleContainer'),
            timer: null,
            burst() {
                const pCount = window.innerWidth <= 768 ? 30 : 50;
                for (let i = 0; i < pCount; i++) {
                    const p = document.createElement('div');
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.random() * 150 + 50;
                    const tx = Math.cos(angle) * dist;
                    const ty = Math.sin(angle) * dist;
                    
                    p.style.position = 'absolute';
                    p.style.left = '50%';
                    p.style.top = '50%';
                    p.style.width = p.style.height = `${Math.random() * 5 + 2}px`;
                    p.style.borderRadius = '50%';
                    p.style.background = Math.random() > 0.3 ? '#0ea5e9' : '#fff';
                    if(Math.random() > 0.8) p.style.boxShadow = `0 0 8px ${p.style.background}`;
                    
                    this.container.appendChild(p);

                    // 👑 Safariでも絶対に動くネイティブAPI
                    const anim = p.animate([
                        { transform: `translate(-50%, -50%) translate3d(0px, 0px, 0px) scale(1)`, opacity: 1 },
                        { transform: `translate(-50%, -50%) translate3d(${tx}px, ${ty}px, 0px) scale(0)`, opacity: 0 }
                    ], {
                        duration: Math.random() * 600 + 400,
                        easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)',
                        fill: 'forwards'
                    });
                    
                    anim.onfinish = () => p.remove();
                }
            },
            start() {
                this.burst();
                this.timer = setInterval(() => this.burst(), 300);
            },
            stop() {
                clearInterval(this.timer);
                this.container.innerHTML = '';
            }
        };

        // =========================================
        // 💾 データとUI更新
        // =========================================
        let bestTotal = parseInt(localStorage.getItem('best_total_score') || 0);
        let spentAP = parseInt(localStorage.getItem('spent_ap') || 0);
        let currentAP = 500 + bestTotal - spentAP; 

        let unlockedBgs = [];
        try { unlockedBgs = JSON.parse(localStorage.getItem('unlocked_bgs')) || []; } catch(e) { unlockedBgs = []; }
        let fixedBg = localStorage.getItem('fixed_bg') || '0';

        const els = {
            ap: document.getElementById('apAmount'), count: document.getElementById('unlockCount'),
            grid: document.getElementById('galleryGrid'), gachaBtn: document.getElementById('gachaBtn'),
            resetBtn: document.getElementById('resetBtn'), modal: document.getElementById('modalOverlay'),
            img: document.getElementById('modalImg'), set: document.getElementById('modalSet'),
            close: document.getElementById('modalClose'), decode: document.getElementById('decodingScreen'),
            hash: document.getElementById('randomHash'), flash: document.getElementById('flashOverlay')
        };

        function updateUI() {
            els.ap.textContent = currentAP;
            els.count.textContent = unlockedBgs.length;
            els.gachaBtn.disabled = (currentAP < GACHA_COST || unlockedBgs.length >= TOTAL_IMAGES);
            if (unlockedBgs.length >= TOTAL_IMAGES) els.gachaBtn.textContent = "全データ復元完了";
        }

        function renderGrid() {
            els.grid.innerHTML = '';
            const folder = getDevicePath();
            for (let i = 1; i <= TOTAL_IMAGES; i++) {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                if (unlockedBgs.includes(i)) {
                    if (fixedBg == i) item.classList.add('active');
                    const img = document.createElement('img');
                    img.src = `${folder}bg (${i}).webp`; img.loading = "lazy";
                    item.appendChild(img);
                    item.addEventListener('click', () => openModal(i, img.src));
                } else {
                    item.classList.add('locked');
                    item.innerHTML = `<div class="locked-icon">🔒</div><div class="locked-id">No.${i.toString().padStart(3, '0')}</div>`;
                }
                els.grid.appendChild(item);
            }
        }

        // =========================================
        // 👑 モーダル ＆ 絶対動くガチャ演出
        // =========================================
        let currentSelectedId = null;
        let hashInterval = null;

        function openModal(id, src, isGacha = false) {
            currentSelectedId = id;
            els.modal.classList.add('show');
            els.modal.classList.remove('decoded'); // 画像のCSSを初期状態(透明)に戻す
            
            if (isGacha) {
                els.decode.classList.add('active');
                ParticleEngine.start(); // 👑 Web Animations API起動
                
                hashInterval = setInterval(() => {
                    els.hash.textContent = '0x' + Math.random().toString(16).substring(2, 12).toUpperCase();
                }, 50);

                setTimeout(() => {
                    // 1. デコード終了処理
                    clearInterval(hashInterval);
                    ParticleEngine.stop();
                    els.decode.classList.remove('active');
                    
                    // 2. フラッシュ演出
                    els.flash.classList.add('active');
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => els.flash.classList.remove('active'));
                    });
                    
                    Engine.playDecoded();
                    
                    // 3. 画像セット ＆ フェードイン
                    els.img.src = src;
                    void els.modal.offsetWidth; // 👑 CSS再計算を強制（超重要）
                    els.modal.classList.add('decoded');
                    
                }, 1600);
            } else {
                els.decode.classList.remove('active');
                els.img.src = src;
                void els.modal.offsetWidth; // 👑 CSS再計算を強制
                els.modal.classList.add('decoded');
            }
        }

        const closeModal = () => {
            els.modal.classList.remove('show'); els.modal.classList.remove('decoded');
            clearInterval(hashInterval); ParticleEngine.stop();
            setTimeout(() => { if(!els.modal.classList.contains('show')) els.img.src = ''; }, 300);
        };
        els.close.addEventListener('click', closeModal);

        els.set.addEventListener('click', () => {
            if (currentSelectedId) {
                Engine.playSet();
                fixedBg = currentSelectedId; localStorage.setItem('fixed_bg', fixedBg);
                renderGrid(); closeModal();
                alert(`No.${currentSelectedId} をポータル背景に固定しました。`);
            }
        });

        els.resetBtn.addEventListener('click', () => {
            Engine.init(); Engine.playSet();
            fixedBg = '0'; localStorage.setItem('fixed_bg', '0');
            renderGrid(); alert("背景をランダムスライドショーに戻しました。");
        });

        // =========================================
        // 👑 ガチャ実行ロジック
        // =========================================
        els.gachaBtn.addEventListener('click', () => {
            Engine.init(); // iPhoneでのAudio再生許可

            if (currentAP < GACHA_COST || unlockedBgs.length >= TOTAL_IMAGES) return;

            Engine.playGachaStart();

            // AP消費処理
            currentAP -= GACHA_COST;
            spentAP += GACHA_COST;
            localStorage.setItem('spent_ap', spentAP); 

            let lockedIds = [];
            for (let i = 1; i <= TOTAL_IMAGES; i++) { if (!unlockedBgs.includes(i)) lockedIds.push(i); }
            const newId = lockedIds[Math.floor(Math.random() * lockedIds.length)];
            
            unlockedBgs.push(newId);
            localStorage.setItem('unlocked_bgs', JSON.stringify(unlockedBgs));

            updateUI();
            
            const folder = getDevicePath();
            const src = `${folder}bg (${newId}).webp`;
            
            openModal(newId, src, true);
            setTimeout(renderGrid, 1800);
        });

        updateUI(); renderGrid();
    </script>
</body>
</html>
