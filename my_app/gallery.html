<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>データ・アーカイブ - CORE ANALYZER</title>
    <style>
        /* =========================================
           1. 基本設定＆カラーパレット
           ========================================= */
        :root {
            --bg-dark: #020617;
            --bg-gradient: linear-gradient(135deg, #020617, #1e1b4b, #020617);
            --glass-bg: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent-color: #0ea5e9; 
            --accent-glow: rgba(14, 165, 233, 0.7);
            --success-color: #10b981;
            --success-glow: rgba(16, 185, 129, 0.8);
            --warning-color: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; user-select: none; -webkit-touch-callout: none; }
        
        /* 👑 修正: 上部のナビゲーションが被らないように padding-top を追加 */
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100dvh; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; padding-top: 80px; padding-bottom: 120px; scroll-behavior: smooth; }
        .scanlines { position: fixed; inset: 0; z-index: -1; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%); background-size: 100% 4px; pointer-events: none; }

        /* =========================================
           2. ヘッダー＆コントロール
           ========================================= */
        /* 👑 修正: スクロールしても絶対に隠れないよう fixed に変更し、背景を暗くする */
        .top-nav-wrapper { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass-border); display: flex; justify-content: center; }
        .top-nav { width: 100%; max-width: 1000px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .back-btn { display: inline-flex; align-items: center; gap: 5px; color: #fff; text-decoration: none; font-size: 0.9rem; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 20px; border: 1px solid var(--glass-border); backdrop-filter: blur(8px); transition: all 0.2s; }
        .back-btn:active { transform: scale(0.95); }

        .ap-display { background: rgba(14, 165, 233, 0.15); border: 1px solid var(--accent-color); padding: 8px 18px; border-radius: 20px; font-weight: bold; color: #fff; text-shadow: 0 0 10px var(--accent-glow); box-shadow: 0 0 15px rgba(14, 165, 233, 0.3); font-size: 0.9rem; }
        .ap-display span { color: var(--accent-color); font-size: 1.2rem; margin-right: 5px; font-variant-numeric: tabular-nums; }

        .dashboard { width: 100%; max-width: 1000px; padding: 0 15px 15px; display: flex; flex-direction: column; gap: 15px; z-index: 10; }
        .control-panel { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); gap: 15px; }
        @media (max-width: 600px) { .control-panel { flex-direction: column; text-align: center; } }
        
        .control-info h2 { font-size: 1.2rem; margin-bottom: 5px; }
        .control-info p { font-size: 0.85rem; color: var(--text-dim); }
        .reset-btn { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--glass-border); padding: 12px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .reset-btn:active { transform: scale(0.95); }

        /* =========================================
           3. 👑 フリップ・ギャラリー・グリッド
           ========================================= */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; width: 100%; max-width: 1000px; padding: 0 15px 20px; z-index: 10; }
        @media (min-width: 600px) { .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; } }

        /* カードの3Dフリップ設定 */
        .gallery-item { aspect-ratio: 9/16; perspective: 1000px; cursor: pointer; }
        @media (min-width: 769px) { .gallery-item { aspect-ratio: 16/9; } }

        .item-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.4); border: 1px solid var(--glass-border); }
        
        /* 解放されたら裏返る */
        .gallery-item.unlocked .item-inner { transform: rotateY(180deg); cursor: pointer; }
        .gallery-item.unlocked:hover .item-inner { border-color: var(--accent-color); box-shadow: 0 10px 25px rgba(14, 165, 233, 0.4); transform: rotateY(180deg) scale(1.03) translateY(-5px); }
        
        .item-front, .item-back { position: absolute; inset: 0; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 12px; overflow: hidden; }
        
        /* 表面（未解放ロック状態） */
        .item-front { background: #010409; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #475569; border-style: dashed; border-width: 2px; border-color: #334155; }
        .locked-icon { font-size: 1.8rem; margin-bottom: 5px; opacity: 0.4; }
        .locked-id { font-size: 0.7rem; font-weight: bold; letter-spacing: 1px; }

        /* 裏面（画像表示状態） */
        .item-back { background: #000; transform: rotateY(180deg); }
        .item-back img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: opacity 0.3s; }
        .gallery-item.unlocked:hover .item-back img { opacity: 1; }

        /* 固定中のバッジ */
        .gallery-item.active .item-inner { border: 2px solid var(--success-color); box-shadow: 0 0 20px var(--success-glow); }
        .gallery-item.active .item-back img { opacity: 1; }
        .gallery-item.active .item-back::after { content: '✓ FIXED'; position: absolute; top: 8px; right: 8px; background: var(--success-color); color: #fff; font-size: 0.6rem; font-weight: bold; padding: 3px 8px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        /* 👑 当たった瞬間のサクセス・フラッシュ */
        .flash-effect .item-inner { animation: successFlash 1.5s ease-out forwards; }
        @keyframes successFlash {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); border-color: transparent; }
            30% { box-shadow: 0 0 30px 15px rgba(16, 185, 129, 0.9); border-color: #10b981; }
            100% { box-shadow: 0 0 10px 0 rgba(16, 185, 129, 0.2); border-color: var(--glass-border); }
        }

        /* =========================================
           4. 👑 超サクサク・ガチャボタン（1回 ＆ 10連）
           ========================================= */
        .gacha-footer { position: fixed; bottom: 0; left: 0; width: 100%; padding: 15px; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 1000; display: flex; justify-content: center; border-top: 1px solid var(--glass-border); }
        .gacha-btn-group { display: flex; gap: 10px; width: 100%; max-width: 600px; }
        
        .gacha-btn { flex: 1; padding: 18px 10px; border-radius: 16px; font-size: 1.1rem; font-weight: bold; color: #fff; cursor: pointer; transition: all 0.1s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 2px solid rgba(255,255,255,0.3); text-shadow: 0 1px 3px rgba(0,0,0,0.4); line-height: 1.2; }
        .gacha-btn:active { transform: scale(0.96); }
        .gacha-btn:disabled { background: #334155 !important; color: #94a3b8 !important; box-shadow: none !important; cursor: not-allowed; border-color: transparent !important; }
        
        .btn-single { background: var(--accent-color); box-shadow: 0 5px 20px var(--accent-glow); }
        .btn-single:not(:disabled):hover { background: #0284c7; box-shadow: 0 8px 25px var(--accent-glow); transform: translateY(-3px); }
        
        .btn-multi { background: var(--warning-color); box-shadow: 0 5px 20px rgba(245, 158, 11, 0.5); }
        .btn-multi:not(:disabled):hover { background: #d97706; box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6); transform: translateY(-3px); }
        
        .gacha-cost { font-size: 0.75rem; font-weight: normal; opacity: 0.9; }

        /* =========================================
           5. プレビュー＆固定用シンプルモーダル（演出なし）
           ========================================= */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; padding: 20px; }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-content { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 15px; align-items: center; transform: scale(0.95); transition: transform 0.2s; }
        .modal-overlay.show .modal-content { transform: scale(1); }
        .modal-img { width: 100%; max-height: 75vh; object-fit: contain; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); border: 1px solid var(--glass-border); }
        .modal-actions { display: flex; gap: 12px; width: 100%; }
        .modal-btn { flex: 1; padding: 16px; border-radius: 50px; font-weight: bold; border: none; cursor: pointer; font-size: 1rem; transition: all 0.2s; }
        .modal-btn:active { transform: scale(0.95); }
        .btn-set { background: var(--success-color); color: #fff; box-shadow: 0 4px 15px var(--success-glow); }
        .btn-close { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--glass-border); }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div class="top-nav-wrapper">
        <div class="top-nav">
            <a href="index.html" class="back-btn">⬅ ポータルへ戻る</a>
            <div class="ap-display"><span id="apAmount">0</span> AP</div>
        </div>
    </div>

    <div class="dashboard">
        <div class="control-panel">
            <div class="control-info">
                <h2>DATA ARCHIVE</h2>
                <p>取得状況: <strong id="unlockCount">0</strong> / 200</p>
            </div>
            <button class="reset-btn" id="resetBtn">🔄 ランダム表示に戻す</button>
        </div>
    </div>

    <div class="gallery-grid" id="galleryGrid">
        </div>

    <div class="gacha-footer">
        <div class="gacha-btn-group">
            <button class="gacha-btn btn-single" id="btnSingle">
                <div>🎲 1回 取得</div><div class="gacha-cost">100 AP</div>
            </button>
            <button class="gacha-btn btn-multi" id="btnMulti">
                <div>🔥 10連 取得</div><div class="gacha-cost">1000 AP</div>
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <img src="" class="modal-img" id="modalImg">
            <div class="modal-actions">
                <button class="modal-btn btn-close" id="modalClose">✕ 閉じる</button>
                <button class="modal-btn btn-set" id="modalSet">🖥️ 背景に固定</button>
            </div>
        </div>
    </div>

    <script>
        const TOTAL_IMAGES = 200;
        const GACHA_COST = 100;
        const MULTI_COST = 1000;
        function getDevicePath() { return window.innerWidth <= 768 ? 'bg/sp/' : 'bg/pc/'; }

        // =========================================
        // 🔧 サクサク効果音（小気味良いUIサウンド）
        // =========================================
        const Sound = {
            ctx: null,
            init() { 
                try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); 
                      if (this.ctx.state === 'suspended') this.ctx.resume(); } catch(e){} 
            },
            playFlip() {
                if(!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.1, now + 0.02); gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            },
            playSuccess() {
                if(!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'triangle'; osc.frequency.setValueAtTime(1200, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        };

        // =========================================
        // 💾 データとUI
        // =========================================
        let currentAP = parseInt(localStorage.getItem('core_ap')) || 0;
        let unlockedBgs = JSON.parse(localStorage.getItem('unlocked_bgs')) || [];
        let fixedBg = localStorage.getItem('fixed_bg') || '0';

        const els = {
            ap: document.getElementById('apAmount'), count: document.getElementById('unlockCount'),
            grid: document.getElementById('galleryGrid'), 
            btnSingle: document.getElementById('btnSingle'), btnMulti: document.getElementById('btnMulti'),
            resetBtn: document.getElementById('resetBtn'), 
            modal: document.getElementById('modalOverlay'), img: document.getElementById('modalImg'), 
            set: document.getElementById('modalSet'), close: document.getElementById('modalClose')
        };

        function updateUI() {
            els.ap.textContent = currentAP;
            els.count.textContent = unlockedBgs.length;
            const remaining = TOTAL_IMAGES - unlockedBgs.length;
            
            els.btnSingle.disabled = (currentAP < GACHA_COST || remaining < 1);
            if (remaining < 1) els.btnSingle.innerHTML = "🚫 コンプリート";

            // 10連ボタンは「AP1000以上」かつ「残り10個以上」の時のみ有効
            els.btnMulti.disabled = (currentAP < MULTI_COST || remaining < 10);
            if (remaining < 10) els.btnMulti.innerHTML = "🚫 10連不可";
        }

        // 👑 初期グリッドの生成（裏表構造のカードを作る）
        function initGrid() {
            els.grid.innerHTML = '';
            const folder = getDevicePath();
            for (let i = 1; i <= TOTAL_IMAGES; i++) {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.id = `card-${i}`;

                const inner = document.createElement('div');
                inner.className = 'item-inner';

                const front = document.createElement('div');
                front.className = 'item-front';
                front.innerHTML = `<div class="locked-icon">🔒</div><div class="locked-id">No.${i.toString().padStart(3, '0')}</div>`;

                const back = document.createElement('div');
                back.className = 'item-back';

                // すでに解放済みの場合は画像を入れて、裏返しておく
                if (unlockedBgs.includes(i)) {
                    item.classList.add('unlocked');
                    if (fixedBg == i) item.classList.add('active');
                    back.innerHTML = `<img src="${folder}bg (${i}).webp" loading="lazy">`;
                    
                    // 解放済みカードをクリックしたらプレビューを開く
                    item.addEventListener('click', () => openPreview(i, `${folder}bg (${i}).webp`));
                }

                inner.appendChild(front);
                inner.appendChild(back);
                item.appendChild(inner);
                els.grid.appendChild(item);
            }
        }

        // =========================================
        // 👑 爆速フリップ・ガチャ実行ロジック
        // =========================================
        function executeGacha(times) {
            Sound.init();

            let lockedIds = [];
            for (let i = 1; i <= TOTAL_IMAGES; i++) { if (!unlockedBgs.includes(i)) lockedIds.push(i); }
            if (lockedIds.length < times) return;

            // AP消費処理
            const cost = GACHA_COST * times;
            currentAP -= cost;
            let spentAP = parseInt(localStorage.getItem('spent_ap') || 0);
            localStorage.setItem('core_ap', currentAP);
            localStorage.setItem('spent_ap', spentAP + cost);

            const folder = getDevicePath();
            let pulledIds = [];

            // 抽選
            for (let t = 0; t < times; t++) {
                const idx = Math.floor(Math.random() * lockedIds.length);
                const newId = lockedIds.splice(idx, 1)[0];
                pulledIds.push(newId);
                unlockedBgs.push(newId);
            }
            localStorage.setItem('unlocked_bgs', JSON.stringify(unlockedBgs));
            updateUI();

            // 👑 自動スクロール ＆ フリップ演出
            // 最初の1枚目の位置へスムーズにスクロール
            const firstCard = document.getElementById(`card-${pulledIds[0]}`);
            if (firstCard) {
                // ナビゲーションバーの高さ(約80px)を考慮して少し上めにスクロールさせる
                const y = firstCard.getBoundingClientRect().top + window.pageYOffset - 100;
                window.scrollTo({ top: y, behavior: 'smooth' });
            }

            // 複数枚の場合は時間差（パパパパッ）でめくる
            pulledIds.forEach((id, index) => {
                setTimeout(() => {
                    const card = document.getElementById(`card-${id}`);
                    if (!card) return;

                    // 1. 裏面に画像をセット
                    const back = card.querySelector('.item-back');
                    back.innerHTML = `<img src="${folder}bg (${id}).webp">`;

                    // 2. クラスを付与して裏返す（フラッシュエフェクト付き）
                    card.classList.add('unlocked', 'flash-effect');
                    Sound.playFlip();

                    // 3. クリックイベント（プレビュー用）を追加
                    card.addEventListener('click', () => openPreview(id, `${folder}bg (${id}).webp`));
                    
                    // 最後の1枚がめくれたらサクセス音
                    if(index === pulledIds.length - 1) setTimeout(() => Sound.playSuccess(), 400);

                }, index * 150); // 0.15秒間隔で次々とめくれる
            });
        }

        // ボタンのイベントリスナー
        els.btnSingle.addEventListener('click', () => executeGacha(1));
        els.btnMulti.addEventListener('click', () => executeGacha(10));

        // =========================================
        // 🖼️ シンプルなプレビュー＆背景固定機能
        // =========================================
        let previewId = null;
        function openPreview(id, src) {
            previewId = id;
            els.img.src = src;
            els.modal.classList.add('show');
        }

        const closePreview = () => { els.modal.classList.remove('show'); setTimeout(() => els.img.src = '', 200); };
        els.close.addEventListener('click', closePreview);
        els.modal.addEventListener('click', (e) => { if(e.target === els.modal) closePreview(); });

        els.set.addEventListener('click', () => {
            if (previewId) {
                Sound.init(); Sound.playSuccess();
                fixedBg = previewId; localStorage.setItem('fixed_bg', fixedBg);
                
                // バッジの付け替え
                document.querySelectorAll('.gallery-item').forEach(item => item.classList.remove('active'));
                document.getElementById(`card-${previewId}`).classList.add('active');
                
                closePreview();
                alert(`No.${previewId} をポータル背景に固定しました。`);
            }
        });

        els.resetBtn.addEventListener('click', () => {
            Sound.init(); Sound.playSuccess();
            fixedBg = '0'; localStorage.setItem('fixed_bg', '0');
            document.querySelectorAll('.gallery-item').forEach(item => item.classList.remove('active'));
            alert("背景をランダムスライドショーに戻しました。");
        });

        // 初期化実行
        updateUI(); initGrid();
    </script>
</body>
</html>
